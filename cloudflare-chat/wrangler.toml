name = "raw-strength-employee-chat"
main = "src/index.js"
compatibility_date = "2026-10-15"

[assets]
directory = "../chat-web"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "rsc-employee-chat"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[vars]
CHAT_ALLOWED_ORIGINS = ""
