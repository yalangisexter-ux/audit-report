name: Apply login attendance restore
on:
  push:
    paths:
      - "tools/apply_login_attendance_restore.py"
      - ".github/workflows/apply-login-attendance-restore.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply restore and patches
        run: |
          set -euo pipefail
          python3 tools/apply_login_attendance_restore.py
          python3 -m py_compile api_server.py web_auth_shim.py
          grep -q "Rename legacy customer identity" web_auth_shim.py
          grep -q "check_in=excluded.check_in" api_server.py
          test "$(wc -c < api_server.py)" -gt 1000
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api_server.py web_auth_shim.py
          if git diff --cached --quiet; then echo No change; exit 0; fi
          git commit -m "fix(web): restore api_server, Admin login (Shiva@01), attendance clear-times"
          git push
