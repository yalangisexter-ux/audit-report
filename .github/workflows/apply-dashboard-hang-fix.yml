name: Apply dashboard hang fix
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/apply_dashboard_hang_fix.py"
      - ".github/workflows/apply-dashboard-hang-fix.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal Dashboard hang fix
        run: |
          set -e
          python3 tools/apply_dashboard_hang_fix.py
          if git diff --quiet app.py; then
            echo "No app.py changes (already applied)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "fix: stop Dashboard sidebar hang (minimal, no feature changes)"
          git push
