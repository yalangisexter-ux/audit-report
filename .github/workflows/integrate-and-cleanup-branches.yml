name: Integrate feature branches and cleanup

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Integrate unique application changes onto main
        run: |
          set -euo pipefail
          git fetch --all --prune
          test -f installer.iss
          test -d customer-data

          merge_or_resolve() {
            local branch="$1"
            local msg="$2"
            if ! git rev-parse --verify "origin/${branch}" >/dev/null 2>&1; then
              echo "skip missing ${branch}"
              return 0
            fi
            if git merge --no-edit "origin/${branch}"; then
              echo "merged clean ${branch}"
              return 0
            fi
            echo "resolving conflicts for ${branch}"
            git checkout --ours -- installer.iss customer-data 2>/dev/null || true
            if [ -f customer_prospects.py ] && grep -q '^<<<<<<<' customer_prospects.py 2>/dev/null; then
              if [ "${branch}" = "fix/customer-admin-sync-store-directory" ]; then
                git checkout --theirs -- customer_prospects.py || true
              fi
            fi
            for f in app.py tests/test_role_separation.py tests/test_customer_prospects.py; do
              if [ -f "$f" ] && grep -q '^<<<<<<<' "$f" 2>/dev/null; then
                git checkout --ours -- "$f" || true
              fi
            done
            if [ -f frontend/src/index.css ] && grep -q '^<<<<<<<' frontend/src/index.css 2>/dev/null; then
              git checkout --theirs -- frontend/src/index.css || true
            fi
            if [ -f .github/workflows/master.yml ] && grep -q '^<<<<<<<' .github/workflows/master.yml 2>/dev/null; then
              python3 - <<'PY'
from pathlib import Path
text = Path('.github/workflows/master.yml').read_text(encoding='utf-8')
out=[]; lines=text.splitlines(keepends=True); i=0
while i < len(lines):
    if lines[i].startswith('<<<<<<<'):
        i+=1; ours=[]
        while i < len(lines) and not lines[i].startswith('======='):
            ours.append(lines[i]); i+=1
        if i < len(lines): i+=1
        while i < len(lines) and not lines[i].startswith('>>>>>>>'):
            i+=1
        if i < len(lines): i+=1
        block=''.join(ours)
        if 'branches:' in block:
            out.append('    branches: [main]\n')
        else:
            out.extend(ours)
    else:
        out.append(lines[i]); i+=1
Path('.github/workflows/master.yml').write_text(''.join(out), encoding='utf-8')
PY
            fi
            if git diff --name-only --diff-filter=U | grep -q .; then
              git diff --name-only --diff-filter=U | while read -r u; do
                git checkout --ours -- "$u" || true
                git add "$u" || true
              done
            fi
            git add -A
            git commit -m "${msg}" || true
          }

          merge_or_resolve "fix/customer-admin-sync-store-directory" "merge: fix/customer-admin-sync-store-directory (app only; snapshots/installer protected)"
          merge_or_resolve "fix/render-web-persistence-setup" "merge: fix/render-web-persistence-setup"
          merge_or_resolve "fix/windows-exe-parity-hardening" "merge: fix/windows-exe-parity-hardening"
          merge_or_resolve "merge/feature-cleanup-2026-11-02" "merge: merge/feature-cleanup-2026-11-02"
          merge_or_resolve "webapp/rebuild-v2" "merge: webapp/rebuild-v2"

          if [ -f .github/workflows/master.yml ]; then
            python3 - <<'PY'
from pathlib import Path
import re
p = Path('.github/workflows/master.yml')
t = p.read_text(encoding='utf-8')
t2 = re.sub(r'branches:\s*\[[^\]]*\]', 'branches: [main]', t, count=2)
if t2 != t:
    p.write_text(t2, encoding='utf-8')
    print('normalized workflow branch triggers to main')
PY
            git add .github/workflows/master.yml
            git diff --cached --quiet || git commit -m "ci: run Master workflow on main only after branch cleanup"
          fi

          git checkout HEAD -- installer.iss
          git checkout HEAD -- customer-data || true

      - name: Push integrated main
        run: |
          set -euo pipefail
          git push origin HEAD:main

      - name: Delete obsolete feature branches
        run: |
          set -euo pipefail
          for b in \
            fix/continuous-sync-web-auth-password-visibility \
            fix/customer-admin-sync-store-directory \
            fix/render-web-persistence-setup \
            fix/windows-exe-parity-hardening \
            merge/feature-cleanup-2026-11-02 \
            webapp/rebuild-v2
          do
            if git ls-remote --heads origin "$b" | grep -q .; then
              git push origin --delete "$b" && echo "Deleted $b" || echo "Could not delete $b"
            else
              echo "Branch absent: $b"
            fi
          done

      - name: Report remaining branches
        run: |
          git fetch --prune
          echo "Remaining remote branches:"
          git branch -r
