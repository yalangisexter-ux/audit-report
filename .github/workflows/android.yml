name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Sync latest mobile web assets to Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r mobile/* android/app/src/main/assets/

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Rename and verify APK
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/RawStrengthEmployeeAuditManager-v1.3.18.apk
          ls -la apk-output/

      - name: Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RawStrengthEmployeeAuditManager-v1.3.18-APK
          path: apk-output/RawStrengthEmployeeAuditManager-v1.3.18.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.18
          name: Raw Strength Employee Audit Manager v1.3.18
          files: apk-output/RawStrengthEmployeeAuditManager-v1.3.18.apk
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
        continue-on-error: true
