name: Restore customer_prospects from feature tip

on:
  push:
    paths:
      - "tools/TRIGGER_RESTORE_PROSPECTS"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore customer_prospects.py only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SHA=4c7a9dd4f69a5fc86b6cb0f53c4ca44b9b499016
          git fetch origin "$SHA"
          git show "$SHA:customer_prospects.py" > customer_prospects.py
          # Never touch snapshots or installer
          git checkout HEAD -- installer.iss customer-data || true
          git add customer_prospects.py
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "merge: restore Store Directory customer_prospects from feature tip (snapshots untouched)"
          git push origin HEAD:main
