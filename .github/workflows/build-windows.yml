name: Build Raw Strength Employee Audit Manager (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set release version
        shell: pwsh
        run: |
          $version = "1.1.$env:GITHUB_RUN_NUMBER"
          "APP_VERSION = `"$version`"" | Set-Content -Encoding ascii build_info.py
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install test dependency
        shell: pwsh
        run: python -m pip install pytest

      - name: Run database migration tests
        shell: pwsh
        run: python -m pytest -q tests

      - name: Check source syntax
        shell: pwsh
        run: python -m py_compile app.py build_info.py

      - name: Build Windows app bundle
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --noupx --windowed `
            --name RawStrengthEmployeeAuditManager `
            --icon assets/raw_strength_icon.ico `
            --version-file version_info.txt `
            --collect-all shiboken6 `
            --collect-all docx `
            --collect-all reportlab `
            --add-data "assets;assets" app.py

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "dist/RawStrengthEmployeeAuditManager/RawStrengthEmployeeAuditManager.exe"
          if (!(Test-Path $exe)) { throw "Build failed: $exe was not created." }
          $bundle = "dist/RawStrengthEmployeeAuditManager"
          $requiredRuntimeFiles = @(
            "$bundle/_internal/python312.dll",
            "$bundle/_internal/base_library.zip"
          )
          foreach ($file in $requiredRuntimeFiles) {
            if (!(Test-Path $file)) { throw "Build failed: required PyInstaller runtime file is missing: $file" }
          }
          $zip = "$bundle/_internal/base_library.zip"
          if ((Get-Item $zip).Length -lt 100000) { throw "Build failed: base_library.zip is unexpectedly small or incomplete." }
          Write-Host "Verified required PyInstaller runtime files."

      # Keep a compatibility asset for older installed app versions whose updater
      # still expects base_library.zip as a separate release download.
      - name: Prepare legacy updater compatibility asset
        shell: pwsh
        run: |
          $runtime = "dist/RawStrengthEmployeeAuditManager/_internal/base_library.zip"
          if (!(Test-Path $runtime)) { throw "Compatibility runtime asset missing: $runtime" }
          Copy-Item $runtime "base_library.zip" -Force
          if ((Get-Item "base_library.zip").Length -lt 100000) { throw "Compatibility runtime asset is incomplete." }

      - name: Download and verify Visual C++ runtime
        shell: pwsh
        run: |
          $redist = "vc_redist.x64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile $redist
          $signature = Get-AuthenticodeSignature $redist
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") {
            throw "The Visual C++ Redistributable signature could not be verified as Microsoft-signed."
          }

      - name: Install Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: installer.iss
          options: /O+

      - name: Verify installer
        shell: pwsh
        run: |
          $setup = "installer-output/RawStrengthEmployeeAuditManager-Setup.exe"
          if (!(Test-Path $setup)) { throw "Installer was not created: $setup" }
      - name: Publish GitHub release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Raw Strength Employee Audit Manager 1.1.${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          files: |
            installer-output/RawStrengthEmployeeAuditManager-Setup.exe
            base_library.zip

      - name: Upload Windows EXE and Setup installer
        uses: actions/upload-artifact@v4
        with:
          name: RawStrengthEmployeeAuditManager-Windows-Release
          path: |
            installer-output/RawStrengthEmployeeAuditManager-Setup.exe
            base_library.zip
          if-no-files-found: error
          retention-days: 14
