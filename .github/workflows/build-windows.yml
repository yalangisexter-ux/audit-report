name: Build Raw Strength Employee Audit Manager (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set release version
        shell: pwsh
        run: |
          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          "APP_VERSION = `"$version`"" | Set-Content -Encoding ascii build_info.py
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Check source syntax
        shell: pwsh
        run: python -m py_compile app.py build_info.py

      - name: Build standalone Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name RawStrengthEmployeeAuditManager `
            --icon assets/raw_strength_icon.ico `
            --version-file version_info.txt `
            --collect-all shiboken6 `
            --collect-all docx `
            --collect-all reportlab `
            --add-data "assets;assets" app.py

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "dist/RawStrengthEmployeeAuditManager.exe"
          if (!(Test-Path $exe)) { throw "Build failed: $exe was not created." }

      - name: Install Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: installer.iss
          options: /O+

      - name: Verify installer
        shell: pwsh
        run: |
          $setup = "installer-output/RawStrengthEmployeeAuditManager-Setup.exe"
          if (!(Test-Path $setup)) { throw "Installer was not created: $setup" }
          $exeHash = (Get-FileHash "dist/RawStrengthEmployeeAuditManager.exe" -Algorithm SHA256).Hash
          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash
          @(
            "$exeHash  RawStrengthEmployeeAuditManager.exe"
            "$setupHash  RawStrengthEmployeeAuditManager-Setup.exe"
          ) | Set-Content -Encoding ascii dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: github.event_name == 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Raw Strength Employee Audit Manager 1.0.${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/RawStrengthEmployeeAuditManager.exe
            dist/SHA256SUMS.txt
            installer-output/RawStrengthEmployeeAuditManager-Setup.exe

      - name: Upload Windows EXE and Setup installer
        uses: actions/upload-artifact@v4
        with:
          name: RawStrengthEmployeeAuditManager-Windows-Release
          path: |
            dist/RawStrengthEmployeeAuditManager.exe
            dist/SHA256SUMS.txt
            installer-output/RawStrengthEmployeeAuditManager-Setup.exe
          if-no-files-found: error
          retention-days: 14
