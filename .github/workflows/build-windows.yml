name: Build Raw Strength Employee Audit Manager (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 python-docx reportlab pyinstaller

      - name: Check main script syntax
        shell: pwsh
        run: python -m py_compile app.py

      - name: Build standalone Windows EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name RawStrengthEmployeeAuditManager `
            --collect-all PySide6 `
            --collect-all shiboken6 `
            --collect-all docx `
            --collect-all reportlab `
            --add-data "assets;assets" app.py

      - name: Verify executable and write checksum
        shell: pwsh
        run: |
          $exe = "dist/RawStrengthEmployeeAuditManager.exe"
          if (!(Test-Path $exe)) { throw "Build failed: $exe was not created." }
          Get-FileHash $exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  RawStrengthEmployeeAuditManager.exe" } | Out-File -Encoding ascii dist/SHA256SUMS.txt

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: RawStrengthEmployeeAuditManager-Windows-EXE
          path: |
            dist/RawStrengthEmployeeAuditManager.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
