name: Apply status heal
on:
  push:
    paths:
      - "tools/apply_status_heal.py"
      - ".github/workflows/apply-status-heal.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 tools/apply_status_heal.py
          python3 -m py_compile web_auth_shim.py
          grep -q "status heal skipped" web_auth_shim.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web_auth_shim.py
          if git diff --cached --quiet; then echo No change; exit 0; fi
          git commit -m "fix(web): heal Admin/Shiva@01 on auth status endpoint"
          git push
