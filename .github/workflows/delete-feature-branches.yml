name: Delete obsolete feature branches

on:
  push:
    paths:
      - "tools/TRIGGER_DELETE_BRANCHES"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete feature branches via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="yalangisexter-ux/audit-report"
          for b in \
            fix/continuous-sync-web-auth-password-visibility \
            fix/customer-admin-sync-store-directory \
            fix/render-web-persistence-setup \
            fix/windows-exe-parity-hardening \
            merge/feature-cleanup-2026-11-02 \
            webapp/rebuild-v2
          do
            code=$(curl -s -o /tmp/out -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/git/refs/heads/${b}")
            echo "delete ${b}: HTTP ${code}"
            cat /tmp/out || true
            echo
          done
