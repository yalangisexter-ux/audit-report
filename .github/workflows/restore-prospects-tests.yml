name: Restore prospects tests

on:
  push:
    paths:
      - "tools/TRIGGER_RESTORE_PROSPECTS_TESTS"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore tests from feature tip
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SHA=4c7a9dd4f69a5fc86b6cb0f53c4ca44b9b499016
          git fetch origin "$SHA"
          git show "$SHA:tests/test_customer_prospects.py" > tests/test_customer_prospects.py
          # Keep module already restored; never touch snapshots/installer
          git checkout HEAD -- installer.iss customer-data || true
          git add tests/test_customer_prospects.py
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "test: full Store Directory suite aligned with integrated customer_prospects"
          git push origin HEAD:main
