name: Master Build and Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "customer-data/**"
      - "frontend/dist/**"
      - "tools/**"
      - ".github/workflows/apply-*.yml"
      - ".github/workflows/restore-*.yml"
  workflow_dispatch:

permissions:
  contents: write

# Run every requested validation to completion; do not cancel builds after a new push.
# Encrypted customer database snapshots do not need a full Windows installer build.
# Use a distinct concurrency group for each run. GitHub otherwise retains only
# one pending run per group and silently cancels the previous pending build.
concurrency:
  group: audit-report-main-release-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-and-release:
    environment: cloudflare-chat
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js for chat syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and verify Render React frontend
        shell: pwsh
        run: |
          Push-Location frontend
          try {
            npm ci --include=dev
            if ($LASTEXITCODE -ne 0) { throw "Frontend npm ci failed with exit code $LASTEXITCODE" }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw "Frontend production build failed with exit code $LASTEXITCODE" }
            if (-not (Test-Path "dist/index.html")) { throw "Vite build did not produce frontend/dist/index.html" }
            if (-not (Test-Path "dist/assets")) { throw "Vite build did not produce frontend/dist/assets" }
          }
          finally { Pop-Location }

      - name: Publish built React frontend for the existing Render Python service
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/dist
          if (git diff --cached --quiet) {
            Write-Host "Frontend production bundle is already current."
            exit 0
          }
          git commit -m "Publish freshly built web frontend bundle"
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) {
              # frontend/dist is generated output. Concurrent main builds can
              # publish a different hashed bundle, so resolve only this generated
              # directory in favor of the bundle produced by this run.
              $unmerged = git diff --name-only --diff-filter=U
              if ($LASTEXITCODE -ne 0) { throw "Could not inspect frontend bundle rebase conflicts." }
              $unexpected = @($unmerged | Where-Object { $_ -notlike "frontend/dist/*" })
              if ($unexpected.Count -gt 0) {
                git rebase --abort
                throw "Frontend bundle rebase encountered non-generated conflicts: $($unexpected -join ', ')"
              }
              if ($unmerged.Count -gt 0) {
                git checkout --theirs -- frontend/dist
                if ($LASTEXITCODE -ne 0) { throw "Could not keep the freshly built frontend bundle." }
                git add frontend/dist
                if ($LASTEXITCODE -ne 0) { throw "Could not stage the resolved frontend bundle." }
                git -c core.editor=true rebase --continue
                if ($LASTEXITCODE -ne 0) { throw "Could not complete frontend bundle rebase after resolving generated assets." }
              } else {
                throw "Could not rebase frontend bundle onto latest main."
              }
            }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 4) { throw "Could not publish frontend bundle after four attempts." }
            Start-Sleep -Seconds 3
          }

      - name: Validate Cloudflare Worker and browser chat JavaScript
        shell: pwsh
        run: |
          node --check cloudflare-chat/src/index.js
          node --check chat-web/app.js
          node --check audit-db-sync/src/index.js

      - name: Install and test isolated database-sync Worker
        shell: pwsh
        run: |
          Push-Location audit-db-sync
          try {
            npm install --no-audit --no-fund
            npm run check
            npm test
          }
          finally { Pop-Location }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies and packaging tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
          if ($LASTEXITCODE -ne 0) { throw "Python dependency installation failed." }

      - name: Download high-resolution photographic wallpaper assets
        shell: pwsh
        run: |
          $wallpaperDir = Join-Path $PWD "assets/wallpapers/photos"
          New-Item -ItemType Directory -Force -Path $wallpaperDir | Out-Null
          $wallpapers = @{
            "galaxy.jpg" = "https://images.unsplash.com/photo-1707057538849-f723c167324b?auto=format&fit=crop&fm=jpg&w=1920&q=82"
            "milky_way.jpg" = "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&fm=jpg&w=1920&q=82"
            "ocean_waves.jpg" = "https://images.unsplash.com/photo-1429305223369-4d065fdb6f53?auto=format&fit=crop&fm=jpg&w=1920&q=82"
            "lord_shiva.jpg" = "https://images.unsplash.com/photo-1533743725296-2e099eed32c6?auto=format&fit=crop&fm=jpg&w=1920&q=82"
            "love_couples.jpg" = "https://images.unsplash.com/photo-1618426101260-26afa1d05ec3?auto=format&fit=crop&fm=jpg&w=1920&q=82"
          }
          foreach ($filename in $wallpapers.Keys) {
            $destination = Join-Path $wallpaperDir $filename
            Invoke-WebRequest -Uri $wallpapers[$filename] -OutFile $destination
            if ((Get-Item $destination).Length -lt 10000) { throw "Wallpaper download is incomplete: $filename" }
          }

      - name: Configure optional production Worker endpoints
        shell: pwsh
        env:
          DB_SYNC_WORKER_URL: ${{ vars.DB_SYNC_WORKER_URL }}
          CHAT_WORKER_URL: ${{ vars.CHAT_WORKER_URL }}
        run: |
          $workerUrl = ""
          if ([string]::IsNullOrWhiteSpace($workerUrl)) { $workerUrl = $env:DB_SYNC_WORKER_URL }
          if (-not [string]::IsNullOrWhiteSpace($workerUrl)) {
            $uri = [Uri]$workerUrl
            if ($uri.Scheme -ne "https" -or $uri.Host -notmatch "\\.workers\\.dev$") { throw "Database-sync Worker URL must be an HTTPS Cloudflare Workers hostname." }
            $sourcePath = "database_sync.py"
            $source = Get-Content $sourcePath -Raw
            $replacement = 'DEFAULT_DB_SYNC_WORKER_URL = "' + $workerUrl.TrimEnd("/") + '"'
            $source = [regex]::Replace($source, 'DEFAULT_DB_SYNC_WORKER_URL\\s*=\\s*["''].*?["'']', [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $replacement })
            if (-not $source.Contains($replacement)) { throw "Could not inject database-sync Worker URL." }
            if ($source -notmatch [regex]::Escape($uri.Host)) { throw "Database-sync Worker host validation failed." }
            Set-Content -Path $sourcePath -Value $source -Encoding utf8
          }

          $chatUrl = $env:CHAT_WORKER_URL
          if (-not [string]::IsNullOrWhiteSpace($chatUrl)) {
            $chatUri = [Uri]$chatUrl
            if ($chatUri.Scheme -ne "https" -or $chatUri.Host -notmatch "\\.workers\\.dev$") { throw "Live Chat Worker URL must be an HTTPS Cloudflare Workers hostname." }
            $sourcePath = "cloudflare_chat.py"
            $source = Get-Content $sourcePath -Raw
            $replacement = 'DEFAULT_CHAT_API_BASE = "' + $chatUrl.TrimEnd("/") + '"'
            $source = [regex]::Replace($source, 'DEFAULT_CHAT_API_BASE\\s*=\\s*["''].*?["'']', [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $replacement })
            if (-not $source.Contains($replacement)) { throw "Could not inject production Live Chat endpoint." }
            Set-Content -Path $sourcePath -Value $source -Encoding utf8
          }

      - name: Compile all Python modules
        shell: pwsh
        run: |
          # Exclude one-shot apply scripts under tools/ (nested quotes break compileall)
          python -m compileall -q -x "[\\/]tools[\\/]" .
          if ($LASTEXITCODE -ne 0) { throw "Python syntax compilation failed with exit code $LASTEXITCODE" }

      - name: Run regression tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONWARNINGS: ignore
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "Pytest regression tests failed with exit code $LASTEXITCODE" }

      - name: Download Microsoft Visual C++ runtime prerequisite
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "vc_redist.x64.exe"
          if ((Get-Item "vc_redist.x64.exe").Length -lt 1000000) { throw "Visual C++ runtime download is incomplete." }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if (-not (Test-Path "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe")) { throw "Inno Setup compiler was not installed." }

      - name: Compile standalone Windows application with bundled dependencies
        shell: pwsh
        run: |
          python -m py_compile app.py build_info.py business_tracking.py cloudflare_chat.py database_sync.py
          if ($LASTEXITCODE -ne 0) { throw "Python source compilation failed." }
          pyinstaller --noconfirm --clean --onedir --windowed --hidden-import websocket --hidden-import cryptography --hidden-import cryptography.hazmat.primitives --hidden-import cryptography.hazmat.primitives.ciphers.aead --hidden-import cryptography.hazmat.primitives.kdf.pbkdf2 --hidden-import cryptography.hazmat.primitives.hashes --hidden-import ctypes.wintypes --hidden-import certifi --collect-submodules cryptography --collect-all certifi --name RawStrengthEmployeeAuditManager --icon assets/raw_strength_icon.ico --add-data "assets;assets" --version-file version_info.txt app.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller packaging failed." }
          if (-not (Test-Path "dist/RawStrengthEmployeeAuditManager/RawStrengthEmployeeAuditManager.exe")) { throw "Application executable was not created." }

      - name: Build standalone Windows installer
        shell: pwsh
        env:
          APP_VERSION: "1.3.77"
        run: |
          & "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          if (-not (Test-Path "installer-output/RawStrengthEmployeeAuditManager-Setup.exe")) { throw "Setup installer was not created." }
          if ((Get-Item "installer-output/RawStrengthEmployeeAuditManager-Setup.exe").Length -lt 10000000) { throw "Setup installer is unexpectedly small." }

      - name: Verify legacy v1.1.74 in-place upgrade preserves customer database
        shell: pwsh
        run: |
          $legacySetup = Join-Path $env:RUNNER_TEMP "RawStrengthEmployeeAuditManager-Setup-v1.1.74.exe"
          Invoke-WebRequest -Uri "https://github.com/yalangisexter-ux/audit-report/releases/download/v1.1.74/RawStrengthEmployeeAuditManager-Setup.exe" -OutFile $legacySetup
          $legacyHash = (Get-FileHash -LiteralPath $legacySetup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($legacyHash -ne "19bde24215df6c9276417b5e42d655c3b15ec3ee1cb8dce8a948769c0684aef8") { throw "Legacy v1.1.74 installer checksum mismatch." }

          $legacyInstall = Start-Process -FilePath $legacySetup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait -PassThru
          if ($legacyInstall.ExitCode -ne 0) { throw "Legacy v1.1.74 installer failed with exit code $($legacyInstall.ExitCode)." }

          $installDir = Join-Path $env:ProgramFiles "Raw Strength Employee Audit Manager"
          $installedExe = Join-Path $installDir "RawStrengthEmployeeAuditManager.exe"
          if (-not (Test-Path -LiteralPath $installedExe)) { throw "Legacy installer did not create the expected install directory." }

          $dataDir = Join-Path $env:LOCALAPPDATA "EmployeeAuditManager"
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          $env:RSC_TEST_DATABASE = Join-Path $dataDir "employee_audit.db"
          python -c 'import os,sqlite3; p=os.environ["RSC_TEST_DATABASE"]; c=sqlite3.connect(p); c.execute("CREATE TABLE employees(id INTEGER PRIMARY KEY, employee_name TEXT)"); c.execute("INSERT INTO employees(id,employee_name) VALUES(1,?)",("Legacy Customer Employee",)); c.execute("CREATE TABLE customer_upgrade_sentinel(value TEXT NOT NULL)"); c.execute("INSERT INTO customer_upgrade_sentinel(value) VALUES(?)",("KEEP_EXISTING_CUSTOMER_DATA",)); c.commit(); c.close()'
          if ($LASTEXITCODE -ne 0) { throw "Could not seed the legacy customer database." }
          $databaseHashBefore = (Get-FileHash -LiteralPath $env:RSC_TEST_DATABASE -Algorithm SHA256).Hash

          $latestSetup = (Resolve-Path "installer-output/RawStrengthEmployeeAuditManager-Setup.exe").Path
          # Deliberately omit DATA_DIR to simulate the v1.1.74 updater, which launches Setup without custom parameters.
          $latestArgs = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /CLOSEAPPLICATIONS'
          $upgrade = Start-Process -FilePath $latestSetup -ArgumentList $latestArgs -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "Latest installer failed to upgrade v1.1.74 (exit code $($upgrade.ExitCode))." }

          if (-not (Test-Path -LiteralPath $installedExe)) { throw "In-place upgrade removed the previous install directory." }
          $productVersion = (Get-Item -LiteralPath $installedExe).VersionInfo.ProductVersion
          if (-not $productVersion.StartsWith("1.3.77")) { throw "Wrong executable version after upgrade: $productVersion" }
          $databaseHashAfter = (Get-FileHash -LiteralPath $env:RSC_TEST_DATABASE -Algorithm SHA256).Hash
          if ($databaseHashAfter -ne $databaseHashBefore) { throw "Installer changed the existing customer database file." }
          python -c 'import os,sqlite3; c=sqlite3.connect(os.environ["RSC_TEST_DATABASE"]); assert c.execute("PRAGMA integrity_check").fetchone()[0]=="ok"; assert c.execute("SELECT employee_name FROM employees WHERE id=1").fetchone()[0]=="Legacy Customer Employee"; assert c.execute("SELECT value FROM customer_upgrade_sentinel").fetchone()[0]=="KEEP_EXISTING_CUSTOMER_DATA"; c.close()'
          if ($LASTEXITCODE -ne 0) { throw "Existing customer database data or integrity did not survive the upgrade." }
          Write-Host "PASS: v1.1.74 upgraded in place to v1.3.77; original customer DB hash and records are unchanged."

      - name: Launch smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/RawStrengthEmployeeAuditManager/RawStrengthEmployeeAuditManager.exe").Path
          $env:QT_QPA_PLATFORM = "offscreen"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $proc.Refresh()
          if ($proc.HasExited) { throw "Application exited during launch smoke test (exit code $($proc.ExitCode))." }
          Stop-Process -Id $proc.Id -Force
          Write-Host "PASS: packaged application remained running for 8 seconds."

      - name: Upload installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RawStrengthEmployeeAuditManager-Setup-v1.3.77
          path: installer-output/RawStrengthEmployeeAuditManager-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned release with retry and asset verification
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          $tag = "v1.3.77"
          $asset = "installer-output/RawStrengthEmployeeAuditManager-Setup.exe"
          $published = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release edit $tag --title "Raw Strength Employee Audit Manager v1.3.77" --target $env:GITHUB_SHA
            }
            else {
              gh release create $tag $asset --title "Raw Strength Employee Audit Manager v1.3.77" --generate-notes --target $env:GITHUB_SHA
            }
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $asset --clobber
              if ($LASTEXITCODE -eq 0) {
                $release = gh release view $tag --json assets,isDraft,isPrerelease
                if ($LASTEXITCODE -eq 0) {
                  $metadata = $release | ConvertFrom-Json
                  $installer = @($metadata.assets | Where-Object { $_.name -eq "RawStrengthEmployeeAuditManager-Setup.exe" })
                  if ($installer.Count -eq 1 -and -not $metadata.isDraft -and -not $metadata.isPrerelease) {
                    $published = $true
                    break
                  }
                }
              }
            }
            if ($attempt -lt 4) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if (-not $published) { throw "GitHub release $tag could not be published and verified after four attempts." }
          Write-Host "PASS: $tag contains the verified Windows installer asset."
