name: Master Build and Test

on:
  push:
    branches: [main, feature/cloudflare-live-chat]
  workflow_dispatch:

permissions:
  contents: write

# Give every commit its own concurrency group. New pushes must never cancel
# or replace queued builds for earlier commits.
concurrency:
  group: audit-report-main-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-release:
    environment: cloudflare-chat
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js for chat syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cloudflare Worker and browser chat JavaScript
        shell: pwsh
        run: |
          node --check cloudflare-chat/src/index.js
          node --check chat-web/app.js
          node --check audit-db-sync/src/index.js

      - name: Install and test isolated database-sync Worker
        shell: pwsh
        run: |
          Push-Location audit-db-sync
          try {
            npm install --no-audit --no-fund
            npm run check
            npm test
          }
          finally { Pop-Location }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies and packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run regression tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONWARNINGS: ignore
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PYTHONWARNINGS = "ignore"
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) {
            throw "Pytest regression tests failed with exit code $LASTEXITCODE"
          }

      - name: Download Microsoft Visual C++ runtime prerequisite
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "vc_redist.x64.exe"
          if ((Get-Item "vc_redist.x64.exe").Length -lt 1000000) { throw "Visual C++ runtime download is incomplete." }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { throw "Inno Setup compiler was not installed." }

      - name: Download high-resolution photographic wallpaper assets
        shell: pwsh
        run: |
          $wallpaperDir = "assets/wallpapers/photos"
          New-Item -ItemType Directory -Force -Path $wallpaperDir | Out-Null
          $wallpapers = @{
            "galaxy.jpg" = "https://images.unsplash.com/photo-1707057538849-f723c167324b?auto=format&fit=crop&fm=jpg&w=1920&q=82"
            "milky_way.jpg" = "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&fm=jpg&w=1920&q=82"
            "ocean_waves.jpg" = "https://images.unsplash.com/photo-1429305223369-4d065fdb6f53?auto=format&fit=crop&fm=jpg&w=1920&q=82"
            "lord_shiva.jpg" = "https://images.unsplash.com/photo-1533743725296-2e099eed32c6?auto=format&fit=crop&fm=jpg&w=1920&q=82"
            "love_couples.jpg" = "https://images.unsplash.com/photo-1618426101260-26afa1d05ec3?auto=format&fit=crop&fm=jpg&w=1920&q=82"
          }
          foreach ($name in $wallpapers.Keys) {
            $target = Join-Path $wallpaperDir $name
            Invoke-WebRequest -Uri $wallpapers[$name] -OutFile $target
            $bytes = [System.IO.File]::ReadAllBytes($target)
            if ($bytes.Length -lt 30000 -or $bytes[0] -ne 0xFF -or $bytes[1] -ne 0xD8 -or $bytes[2] -ne 0xFF) {
              throw "Wallpaper download is not a valid high-resolution JPEG: $name"
            }
            Write-Host "Verified photo wallpaper $name ($($bytes.Length) bytes)"
          }

      - name: Deploy production Live Chat Worker
        id: deploy_chat
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CHAT_JWT_SECRET: ${{ secrets.CHAT_JWT_SECRET }}
          CHAT_BOOTSTRAP_TOKEN: ${{ secrets.CHAT_BOOTSTRAP_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN)) { throw "Missing Actions secret CLOUDFLARE_API_TOKEN." }
          try {
            $accRes = Invoke-RestMethod -Uri "https://api.cloudflare.com/client/v4/accounts" -Headers @{ Authorization = "Bearer $($env:CLOUDFLARE_API_TOKEN)" }
            if ($accRes.result -and $accRes.result.Count -gt 0) {
              $matched = $accRes.result | Where-Object { $_.id -eq $env:CLOUDFLARE_ACCOUNT_ID } | Select-Object -First 1
              if ($null -eq $matched) {
                $env:CLOUDFLARE_ACCOUNT_ID = $accRes.result[0].id
                Write-Host "Resolved active Cloudflare Account ID: $($env:CLOUDFLARE_ACCOUNT_ID)"
              }
            }
          } catch {
            Write-Host "Account resolution check: $_"
          }
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)) { throw "Missing Actions variable CLOUDFLARE_ACCOUNT_ID." }
          if ([string]::IsNullOrWhiteSpace($env:CHAT_JWT_SECRET) -or $env:CHAT_JWT_SECRET.Length -lt 32) { throw "CHAT_JWT_SECRET is missing or shorter than 32 characters." }
          if ([string]::IsNullOrWhiteSpace($env:CHAT_BOOTSTRAP_TOKEN)) { throw "Missing Actions secret CHAT_BOOTSTRAP_TOKEN." }
          Push-Location cloudflare-chat
          try {
            npm install --no-audit --no-fund
            npm run check
            npx wrangler d1 migrations apply rsc-employee-chat-livescreen-sharing --remote --config wrangler.toml
            $env:CHAT_JWT_SECRET | npx wrangler secret put CHAT_JWT_SECRET --config wrangler.toml
            $env:CHAT_BOOTSTRAP_TOKEN | npx wrangler secret put CHAT_BOOTSTRAP_TOKEN --config wrangler.toml
            $deployLog = @()
            $deployExitCode = 1
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "Deploying Live Chat Worker (attempt $attempt of 3)..."
              $deployLog = npm run deploy 2>&1
              $deployExitCode = $LASTEXITCODE
              $deployLog | ForEach-Object { Write-Host $_ }
              if ($deployExitCode -eq 0) { break }
              if ($attempt -lt 3) {
                Write-Host "Worker deployment failed with exit code $deployExitCode; retrying in 10 seconds."
                Start-Sleep -Seconds 10
              }
            }
            if ($deployExitCode -ne 0) {
              throw "Live Chat Worker deployment failed after 3 attempts (last exit code $deployExitCode)."
            }
            $workerUrl = [regex]::Matches(($deployLog -join "`n"), 'https://raw-strength-employee-chat[.][A-Za-z0-9-]+[.]workers[.]dev') | Select-Object -Last 1
            if ($null -eq $workerUrl) {
              try {
                $subRes = Invoke-RestMethod -Uri "https://api.cloudflare.com/client/v4/accounts/$($env:CLOUDFLARE_ACCOUNT_ID)/workers/subdomain" -Headers @{ Authorization = "Bearer $($env:CLOUDFLARE_API_TOKEN)" }
                if ($subRes.result -and $subRes.result.subdomain) {
                  $workerUrl = [PSCustomObject]@{ Value = "https://raw-strength-employee-chat.$($subRes.result.subdomain).workers.dev" }
                  Write-Host "Resolved Worker URL from Cloudflare subdomain API: $($workerUrl.Value)"
                }
              } catch {
                Write-Host "Subdomain lookup: $_"
              }
            }
            if ($null -eq $workerUrl) { throw "Worker deploy succeeded but Wrangler output did not expose its URL. Set CHAT_WORKER_URL to the deployed HTTPS URL." }
            "worker_url=$($workerUrl.Value)" >> $env:GITHUB_OUTPUT
          }
          finally { Pop-Location }

      - name: Configure the production Live Chat endpoint when available
        shell: pwsh
        env:
          DEPLOYED_CHAT_WORKER_URL: ${{ steps.deploy_chat.outputs.worker_url }}
          CHAT_WORKER_URL: ${{ vars.CHAT_WORKER_URL }}
        run: |
          $workerUrl = $env:DEPLOYED_CHAT_WORKER_URL
          if ([string]::IsNullOrWhiteSpace($workerUrl)) { $workerUrl = $env:CHAT_WORKER_URL }
          if ([string]::IsNullOrWhiteSpace($workerUrl)) {
            Write-Host "::warning::CHAT_WORKER_URL is missing. Live Chat endpoint will not be preconfigured in this build. Set the variable or ensure deploy step outputs the URL."
            exit 0
          } else {
            $uri = [System.Uri]::new($workerUrl.Trim().TrimEnd('/'))
            if ($uri.Scheme -ne "https" -or $uri.AbsolutePath -ne "/" -or $uri.Query -or $uri.Fragment -or $uri.UserInfo) { 
              Write-Host "::warning::CHAT_WORKER_URL is not a plain HTTPS base URL. Skipping injection."
              exit 0
            }
            $sourcePath = "cloudflare_chat.py"
            $source = Get-Content $sourcePath -Raw
            $source = [regex]::Replace($source, 'DEFAULT_CHAT_API_BASE = ".*?"', ('DEFAULT_CHAT_API_BASE = "' + $uri.GetLeftPart([System.UriPartial]::Authority) + '"'), 1)
            if ($source -notmatch ('DEFAULT_CHAT_API_BASE = "https://' + [regex]::Escape($uri.Host))) { 
              Write-Host "::warning::Could not configure the production Live Chat endpoint."
              exit 0
            }
            Set-Content -Path $sourcePath -Value $source -Encoding utf8
            Write-Host "Configured production Live Chat endpoint: $($uri.GetLeftPart([System.UriPartial]::Authority))"
          }

      - name: Deploy isolated database-sync Worker
        id: deploy_db_sync
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_TOKEN_2: ${{ secrets.RELEASE_TOKEN_2 }}
          DB_SYNC_JWT_SECRET: ${{ secrets.DB_SYNC_JWT_SECRET }}
          CHAT_JWT_SECRET: ${{ secrets.CHAT_JWT_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN)) { throw "Missing Actions secret CLOUDFLARE_API_TOKEN." }
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)) { throw "Missing Actions variable CLOUDFLARE_ACCOUNT_ID." }
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TOKEN_2)) { throw "Missing Actions secret RELEASE_TOKEN_2 (database sync only)." }
          if ([string]::IsNullOrWhiteSpace($env:DB_SYNC_JWT_SECRET)) {
            if ([string]::IsNullOrWhiteSpace($env:CHAT_JWT_SECRET) -or $env:CHAT_JWT_SECRET.Length -lt 32) {
              throw "Set DB_SYNC_JWT_SECRET or provide a strong CHAT_JWT_SECRET for domain-separated fallback."
            }
            $material = [System.Text.Encoding]::UTF8.GetBytes("RawStrengthEmployeeAuditManager:database-sync-worker-jwt:v1:" + $env:CHAT_JWT_SECRET)
            $sha256 = [System.Security.Cryptography.SHA256]::Create()
            try { $env:DB_SYNC_JWT_SECRET = [Convert]::ToHexString($sha256.ComputeHash($material)).ToLowerInvariant() }
            finally { $sha256.Dispose() }
          }
          if ($env:DB_SYNC_JWT_SECRET.Length -lt 32) { throw "Resolved database-sync JWT secret is too weak." }
          Push-Location audit-db-sync
          try {
            $firstDeployLog = @()
            $firstDeployExitCode = 1
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "Preparing database-sync Worker (attempt $attempt of 3)..."
              $firstDeployLog = npm run deploy 2>&1
              $firstDeployExitCode = $LASTEXITCODE
              $firstDeployLog | ForEach-Object { Write-Host $_ }
              if ($firstDeployExitCode -eq 0) { break }
              if ($attempt -lt 3) {
                Write-Host "Initial database-sync deployment failed with exit code $firstDeployExitCode; retrying in 10 seconds."
                Start-Sleep -Seconds 10
              }
            }
            if ($firstDeployExitCode -ne 0) {
              throw "Initial database-sync Worker deployment failed after 3 attempts (last exit code $firstDeployExitCode)."
            }

            $env:RELEASE_TOKEN_2 | npx wrangler secret put RELEASE_TOKEN_2 --config wrangler.toml
            if ($LASTEXITCODE -ne 0) { throw "Could not configure RELEASE_TOKEN_2 for the database-sync Worker." }
            $env:DB_SYNC_JWT_SECRET | npx wrangler secret put JWT_SECRET --config wrangler.toml
            if ($LASTEXITCODE -ne 0) { throw "Could not configure JWT_SECRET for the database-sync Worker." }

            $deployLog = @()
            $deployExitCode = 1
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "Deploying database-sync Worker with configured secrets (attempt $attempt of 3)..."
              $deployLog = npm run deploy 2>&1
              $deployExitCode = $LASTEXITCODE
              $deployLog | ForEach-Object { Write-Host $_ }
              if ($deployExitCode -eq 0) { break }
              if ($attempt -lt 3) {
                Write-Host "Database-sync deployment failed with exit code $deployExitCode; retrying in 10 seconds."
                Start-Sleep -Seconds 10
              }
            }
            if ($deployExitCode -ne 0) {
              throw "Database-sync Worker deployment failed after 3 attempts (last exit code $deployExitCode)."
            }

            $workerUrl = [regex]::Matches(($deployLog -join "`n"), 'https://raw-strength-audit-db-sync[.][A-Za-z0-9-]+[.]workers[.]dev') | Select-Object -Last 1
            if ($null -eq $workerUrl) {
              try {
                $subRes = Invoke-RestMethod -Uri "https://api.cloudflare.com/client/v4/accounts/$($env:CLOUDFLARE_ACCOUNT_ID)/workers/subdomain" -Headers @{ Authorization = "Bearer $($env:CLOUDFLARE_API_TOKEN)" }
                if ($subRes.result -and $subRes.result.subdomain) {
                  $workerUrl = [PSCustomObject]@{ Value = "https://raw-strength-audit-db-sync.$($subRes.result.subdomain).workers.dev" }
                  Write-Host "Resolved Worker URL from Cloudflare subdomain API: $($workerUrl.Value)"
                }
              } catch {
                Write-Host "Subdomain lookup note: $_"
              }
            }
            if ($null -eq $workerUrl) { throw "Database-sync Worker deploy did not expose its URL. Configure DB_SYNC_WORKER_URL with the exact deployed HTTPS URL." }
            "worker_url=$($workerUrl.Value)" >> $env:GITHUB_OUTPUT
          }
          finally { Pop-Location }

      - name: Configure the database-sync Worker endpoint for this build
        shell: pwsh
        env:
          DEPLOYED_DB_SYNC_WORKER_URL: ${{ steps.deploy_db_sync.outputs.worker_url }}
          DB_SYNC_WORKER_URL: ${{ vars.DB_SYNC_WORKER_URL }}
        run: |
          $workerUrl = $env:DEPLOYED_DB_SYNC_WORKER_URL
          if ([string]::IsNullOrWhiteSpace($workerUrl)) { $workerUrl = $env:DB_SYNC_WORKER_URL }
          if ([string]::IsNullOrWhiteSpace($workerUrl)) { throw "No database-sync Worker URL was resolved; refusing to package a build with broken sync." }
          $uri = [System.Uri]::new($workerUrl.Trim().TrimEnd('/'))
          if ($uri.Scheme -ne "https" -or $uri.AbsolutePath -ne "/" -or $uri.Query -or $uri.Fragment -or $uri.UserInfo) { throw "DB_SYNC_WORKER_URL must be a plain HTTPS Worker base URL." }
          $sourcePath = "database_sync.py"
          $source = Get-Content $sourcePath -Raw
          $source = [regex]::Replace($source, 'DEFAULT_DB_SYNC_WORKER_URL = ".*?"', ('DEFAULT_DB_SYNC_WORKER_URL = "' + $uri.GetLeftPart([System.UriPartial]::Authority) + '"'), 1)
          if ($source -notmatch ('DEFAULT_DB_SYNC_WORKER_URL = "https://' + [regex]::Escape($uri.Host))) { throw "Could not inject database-sync Worker URL." }
          Set-Content -Path $sourcePath -Value $source -Encoding utf8
          Write-Host "Configured secure database-sync Worker endpoint."

      - name: Compile Python application with bundled assets
        shell: pwsh
        run: |
          python -m py_compile app.py build_info.py business_tracking.py cloudflare_chat.py database_sync.py
          pyinstaller --noconfirm --clean --onedir --windowed --hidden-import websocket --hidden-import cryptography --hidden-import cryptography.hazmat.primitives --hidden-import cryptography.hazmat.primitives.ciphers.aead --hidden-import cryptography.hazmat.primitives.kdf.pbkdf2 --hidden-import cryptography.hazmat.primitives.hashes --hidden-import ctypes.wintypes --collect-submodules cryptography --name RawStrengthEmployeeAuditManager --icon assets/raw_strength_icon.ico --add-data "assets;assets" --version-file version_info.txt app.py
          if (-not (Test-Path "dist/RawStrengthEmployeeAuditManager/RawStrengthEmployeeAuditManager.exe")) { throw "Application executable was not created." }

      - name: Build standalone Windows installer
        shell: pwsh
        env:
          APP_VERSION: "1.3.43"
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if (-not (Test-Path "installer-output/RawStrengthEmployeeAuditManager-Setup.exe")) { throw "Setup installer was not created." }
          if ((Get-Item "installer-output/RawStrengthEmployeeAuditManager-Setup.exe").Length -lt 10000000) { throw "Setup installer is unexpectedly small." }

      - name: Launch smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/RawStrengthEmployeeAuditManager/RawStrengthEmployeeAuditManager.exe").Path
          $env:QT_QPA_PLATFORM = "offscreen"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $proc.Refresh()
          if ($proc.HasExited) { throw "Application exited during launch smoke test (exit code $($proc.ExitCode))." }
          Stop-Process -Id $proc.Id -Force
          Write-Host "PASS: packaged application remained running for 8 seconds."

      - name: Upload installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RawStrengthEmployeeAuditManager-Setup-v1.3.43
          path: installer-output/RawStrengthEmployeeAuditManager-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned release with direct EXE installer
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.43
          name: Raw Strength Employee Audit Manager v1.3.43
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: installer-output/RawStrengthEmployeeAuditManager-Setup.exe
          fail_on_unmatched_files: true
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
