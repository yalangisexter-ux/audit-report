name: Master Build and Test

on:
  push:
    branches: [main, feature/cloudflare-live-chat, webapp/rebuild-v2]
    paths-ignore:
      - "customer-data/**"
  workflow_dispatch:

permissions:
  contents: write

# Keep only the latest build for each branch. New code pushes cancel stale builds.
# Encrypted customer database snapshots do not need a full Windows installer build.
concurrency:
  group: audit-report-main-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    environment: cloudflare-chat
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js for chat syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Render React frontend
        shell: pwsh
        run: |
          npm --prefix frontend ci --include=dev
          if ($LASTEXITCODE -ne 0) { throw "Frontend dependency installation failed." }
          npm --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { throw "Frontend production build failed." }

      - name: Build and verify Render React frontend
        shell: pwsh
        run: |
          if (-not (Test-Path frontend/dist/index.html)) { throw "frontend/dist/index.html missing after build." }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run regression tests
        shell: pwsh
        run: pytest -q

      - name: Build Windows EXE / installer
        shell: pwsh
        run: |
          if (Test-Path EmployeeAuditManager.spec) {
            python -m PyInstaller --noconfirm EmployeeAuditManager.spec
          } elseif (Test-Path build_installer.py) {
            python build_installer.py
          } else {
            Write-Host "No installer entrypoint found; skipping binary build."
          }

      - name: Upload installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RawStrengthEmployeeAuditManager-Setup
          path: |
            installer-output/**
            dist/**
          if-no-files-found: warn
          retention-days: 14
