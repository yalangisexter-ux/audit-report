name: Master Build and Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "tools/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/apply-*.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: master-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for chat syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Cloudflare chat worker package
        shell: pwsh
        run: |
          if (Test-Path "cloudflare-chat/package.json") {
            Push-Location cloudflare-chat
            npm ci
            if ($LASTEXITCODE -ne 0) { throw "cloudflare-chat npm ci failed." }
            npm test
            if ($LASTEXITCODE -ne 0) { throw "cloudflare-chat tests failed." }
            Pop-Location
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
          if ($LASTEXITCODE -ne 0) { throw "Python dependency installation failed." }

      - name: Inject production worker endpoints when secrets are present
        shell: pwsh
        env:
          DB_SYNC_WORKER_URL: ${{ secrets.DB_SYNC_WORKER_URL }}
          CHAT_WORKER_URL: ${{ secrets.CHAT_WORKER_URL }}
        run: |
          $dbUrl = $env:DB_SYNC_WORKER_URL
          if (-not [string]::IsNullOrWhiteSpace($dbUrl)) {
            $dbUri = [Uri]$dbUrl
            if ($dbUri.Scheme -ne "https" -or $dbUri.Host -notmatch "\\.workers\\.dev$") { throw "DB Sync Worker URL must be an HTTPS Cloudflare Workers hostname." }
            $sourcePath = "database_sync.py"
            $source = Get-Content $sourcePath -Raw
            $replacement = 'FALLBACK_DB_SYNC_WORKER_URL = "' + $dbUrl.TrimEnd("/") + '"'
            $source = [regex]::Replace($source, 'FALLBACK_DB_SYNC_WORKER_URL\\s*=\\s*["''].*?["'']', [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $replacement })
            if (-not $source.Contains($replacement)) { throw "Could not inject production DB Sync endpoint." }
            Set-Content -Path $sourcePath -Value $source -Encoding utf8
          }

          $chatUrl = $env:CHAT_WORKER_URL
          if (-not [string]::IsNullOrWhiteSpace($chatUrl)) {
            $chatUri = [Uri]$chatUrl
            if ($chatUri.Scheme -ne "https" -or $chatUri.Host -notmatch "\\.workers\\.dev$") { throw "Live Chat Worker URL must be an HTTPS Cloudflare Workers hostname." }
            $sourcePath = "cloudflare_chat.py"
            $source = Get-Content $sourcePath -Raw
            $replacement = 'DEFAULT_CHAT_API_BASE = "' + $chatUrl.TrimEnd("/") + '"'
            $source = [regex]::Replace($source, 'DEFAULT_CHAT_API_BASE\\s*=\\s*["''].*?["'']', [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $replacement })
            if (-not $source.Contains($replacement)) { throw "Could not inject production Live Chat endpoint." }
            Set-Content -Path $sourcePath -Value $source -Encoding utf8
          }

      - name: Compile all Python modules
        shell: pwsh
        run: |
          # Exclude one-shot apply scripts and accidental directories under tools/
          python -m compileall -q -x "[\\/]tools[\\/]" .
          if ($LASTEXITCODE -ne 0) { throw "Python syntax compilation failed with exit code $LASTEXITCODE" }

      - name: Run regression tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONWARNINGS: ignore
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed." }

      - name: Download Visual C++ runtime for installer
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "vc_redist.x64.exe"
          if ((Get-Item "vc_redist.x64.exe").Length -lt 1000000) { throw "Visual C++ runtime download is incomplete." }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if (-not (Test-Path "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe")) { throw "Inno Setup compiler was not installed." }

      - name: Compile standalone Windows application with bundled dependencies
        shell: pwsh
        run: |
          python -m py_compile app.py build_info.py business_tracking.py cloudflare_chat.py database_sync.py
          if ($LASTEXITCODE -ne 0) { throw "Python source compilation failed." }
          pyinstaller --noconfirm --clean --onedir --windowed --hidden-import websocket --hidden-import cryptography --hidden-import cryptography.hazmat.primitives --hidden-import cryptography.hazmat.primitives.ciphers.aead --hidden-import cryptography.hazmat.primitives.kdf.pbkdf2 --hidden-import cryptography.hazmat.primitives.hashes --hidden-import ctypes.wintypes --hidden-import certifi --collect-submodules cryptography --collect-all certifi --name RawStrengthEmployeeAuditManager --icon assets/raw_strength_icon.ico --add-data "assets;assets" --version-file version_info.txt app.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller packaging failed." }
          if (-not (Test-Path "dist/RawStrengthEmployeeAuditManager/RawStrengthEmployeeAuditManager.exe")) { throw "Application executable was not created." }

      - name: Build standalone Windows installer
        shell: pwsh
        env:
          APP_VERSION: "1.3.70"
        run: |
          & "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          if (-not (Test-Path "installer-output/RawStrengthEmployeeAuditManager-Setup.exe")) { throw "Setup installer was not created." }
          if ((Get-Item "installer-output/RawStrengthEmployeeAuditManager-Setup.exe").Length -lt 10000000) { throw "Setup installer is unexpectedly small." }

      - name: Launch smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/RawStrengthEmployeeAuditManager/RawStrengthEmployeeAuditManager.exe").Path
          $env:QT_QPA_PLATFORM = "offscreen"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $proc.Refresh()
          if ($proc.HasExited) { throw "Application exited during launch smoke test (exit code $($proc.ExitCode))." }
          Stop-Process -Id $proc.Id -Force
          Write-Host "PASS: packaged application remained running for 8 seconds."

      - name: Upload installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RawStrengthEmployeeAuditManager-Setup-v1.3.70
          path: installer-output/RawStrengthEmployeeAuditManager-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned release with direct EXE installer
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.70
          name: Raw Strength Employee Audit Manager v1.3.70
          files: installer-output/RawStrengthEmployeeAuditManager-Setup.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
