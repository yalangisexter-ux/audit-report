name: Master Build and Test

on:
  push:
    branches: [main, feature/cloudflare-live-chat]
    paths-ignore:
      - "customer-data/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-report-main-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    environment: cloudflare-chat
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js for chat syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Render React frontend
        shell: pwsh
        run: |
          npm --prefix frontend ci --include=dev
          if ($LASTEXITCODE -ne 0) { throw "Frontend dependency installation failed." }
          npm --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { throw "Frontend production build failed." }

      - name: Build and verify Render React frontend
        shell: pwsh
        run: |
          Push-Location frontend
          try {
            npm ci --include=dev
            if ($LASTEXITCODE -ne 0) { throw "Frontend npm ci failed with exit code $LASTEXITCODE" }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw "Frontend production build failed with exit code $LASTEXITCODE" }
            if (-not (Test-Path "dist/index.html")) { throw "Vite build did not produce frontend/dist/index.html" }
            if (-not (Test-Path "dist/assets")) { throw "Vite build did not produce frontend/dist/assets" }
          }
          finally { Pop-Location }

      - name: Validate Cloudflare Worker and browser chat JavaScript
        shell: pwsh
        run: |
          node --check cloudflare-chat/src/index.js
          node --check chat-web/app.js
          node --check audit-db-sync/src/index.js

      - name: Install and test isolated database-sync Worker
        shell: pwsh
        run: |
          Push-Location audit-db-sync
          try {
            npm install --no-audit --no-fund
            npm run check
            npm test
          }
          finally { Pop-Location }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies and packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run regression tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONWARNINGS: ignore
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PYTHONWARNINGS = "ignore"
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) {
            throw "Pytest regression tests failed with exit code $LASTEXITCODE"
          }

      - name: Download Microsoft Visual C++ runtime prerequisite
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "vc_redist.x64.exe"
          if ((Get-Item "vc_redist.x64.exe").Length -lt 1000000) { throw "Visual C++ runtime download is incomplete." }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { throw "Inno Setup compiler was not installed." }

      - name: Compile Python application with bundled assets
        shell: pwsh
        run: |
          python -m py_compile app.py build_info.py business_tracking.py cloudflare_chat.py database_sync.py
          pyinstaller --noconfirm --clean --onedir --windowed --hidden-import websocket --hidden-import cryptography --hidden-import cryptography.hazmat.primitives --hidden-import cryptography.hazmat.primitives.ciphers.aead --hidden-import cryptography.hazmat.primitives.kdf.pbkdf2 --hidden-import cryptography.hazmat.primitives.hashes --hidden-import ctypes.wintypes --hidden-import certifi --collect-submodules cryptography --collect-all certifi --name RawStrengthEmployeeAuditManager --icon assets/raw_strength_icon.ico --add-data "assets;assets" --version-file version_info.txt app.py
          if (-not (Test-Path "dist/RawStrengthEmployeeAuditManager/RawStrengthEmployeeAuditManager.exe")) { throw "Application executable was not created." }

      - name: Build standalone Windows installer
        shell: pwsh
        env:
          APP_VERSION: "1.3.65"
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if (-not (Test-Path "installer-output/RawStrengthEmployeeAuditManager-Setup.exe")) { throw "Setup installer was not created." }
          if ((Get-Item "installer-output/RawStrengthEmployeeAuditManager-Setup.exe").Length -lt 10000000) { throw "Setup installer is unexpectedly small." }

      - name: Launch smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/RawStrengthEmployeeAuditManager/RawStrengthEmployeeAuditManager.exe").Path
          $env:QT_QPA_PLATFORM = "offscreen"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $proc.Refresh()
          if ($proc.HasExited) { throw "Application exited during launch smoke test (exit code $($proc.ExitCode))." }
          Stop-Process -Id $proc.Id -Force
          Write-Host "PASS: packaged application remained running for 8 seconds."

      - name: Upload installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RawStrengthEmployeeAuditManager-Setup-v1.3.65
          path: installer-output/RawStrengthEmployeeAuditManager-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned release with direct EXE installer
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.65
          name: Raw Strength Employee Audit Manager v1.3.65
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: installer-output/RawStrengthEmployeeAuditManager-Setup.exe
          fail_on_unmatched_files: true
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
