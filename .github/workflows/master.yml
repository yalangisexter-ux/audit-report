name: Master Build and Test

on:
  push:
    branches: [main, feature/cloudflare-live-chat]
  workflow_dispatch:

permissions:
  contents: write

# Give every commit its own concurrency group. New pushes must never cancel
# or replace queued builds for earlier commits.
concurrency:
  group: audit-report-main-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js for chat syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cloudflare Worker and browser chat JavaScript
        shell: pwsh
        run: |
          node --check cloudflare-chat/src/index.js
          node --check chat-web/app.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies and packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run regression tests
        run: python -m pytest -q

      - name: Download Microsoft Visual C++ runtime prerequisite
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "vc_redist.x64.exe"
          if ((Get-Item "vc_redist.x64.exe").Length -lt 1000000) { throw "Visual C++ runtime download is incomplete." }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { throw "Inno Setup compiler was not installed." }

      - name: Download high-resolution photographic wallpaper assets
        shell: pwsh
        run: |
          $wallpaperDir = "assets/wallpapers/photos"
          New-Item -ItemType Directory -Force -Path $wallpaperDir | Out-Null
          $wallpapers = @{
            "galaxy.jpg" = "https://images.unsplash.com/photo-1707057538849-f723c167324b?auto=format&fit=crop&fm=jpg&w=1920&q=82"
            "milky_way.jpg" = "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&fm=jpg&w=1920&q=82"
            "ocean_waves.jpg" = "https://images.unsplash.com/photo-1429305223369-4d065fdb6f53?auto=format&fit=crop&fm=jpg&w=1920&q=82"
            "lord_shiva.jpg" = "https://images.unsplash.com/photo-1533743725296-2e099eed32c6?auto=format&fit=crop&fm=jpg&w=1920&q=82"
            "love_couples.jpg" = "https://images.unsplash.com/photo-1618426101260-26afa1d05ec3?auto=format&fit=crop&fm=jpg&w=1920&q=82"
          }
          foreach ($name in $wallpapers.Keys) {
            $target = Join-Path $wallpaperDir $name
            Invoke-WebRequest -Uri $wallpapers[$name] -OutFile $target
            $bytes = [System.IO.File]::ReadAllBytes($target)
            if ($bytes.Length -lt 30000 -or $bytes[0] -ne 0xFF -or $bytes[1] -ne 0xD8 -or $bytes[2] -ne 0xFF) {
              throw "Wallpaper download is not a valid high-resolution JPEG: $name"
            }
            Write-Host "Verified photo wallpaper $name ($($bytes.Length) bytes)"
          }

      - name: Compile Python application with bundled assets
        shell: pwsh
        run: |
          python -m py_compile app.py build_info.py business_tracking.py cloudflare_chat.py
          pyinstaller --noconfirm --clean --onedir --windowed --hidden-import websocket --name RawStrengthEmployeeAuditManager --icon assets/raw_strength_icon.ico --add-data "assets;assets" --version-file version_info.txt app.py
          if (-not (Test-Path "dist/RawStrengthEmployeeAuditManager/RawStrengthEmployeeAuditManager.exe")) { throw "Application executable was not created." }

      - name: Build standalone Windows installer
        shell: pwsh
        env:
          APP_VERSION: "1.2.74"
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if (-not (Test-Path "installer-output/RawStrengthEmployeeAuditManager-Setup.exe")) { throw "Setup installer was not created." }
          if ((Get-Item "installer-output/RawStrengthEmployeeAuditManager-Setup.exe").Length -lt 10000000) { throw "Setup installer is unexpectedly small." }

      - name: Launch smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/RawStrengthEmployeeAuditManager/RawStrengthEmployeeAuditManager.exe").Path
          $env:QT_QPA_PLATFORM = "offscreen"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $proc.Refresh()
          if ($proc.HasExited) { throw "Application exited during launch smoke test (exit code $($proc.ExitCode))." }
          Stop-Process -Id $proc.Id -Force
          Write-Host "PASS: packaged application remained running for 8 seconds."

      - name: Upload installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RawStrengthEmployeeAuditManager-Setup-v1.2.74
          path: installer-output/RawStrengthEmployeeAuditManager-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned release with direct EXE installer
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.74
          name: Raw Strength Employee Audit Manager v1.2.74
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: installer-output/RawStrengthEmployeeAuditManager-Setup.exe
          fail_on_unmatched_files: true
          # Prefer a repository-configured PAT when the default Actions token is
          # restricted from creating releases by repository/organization policy.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
