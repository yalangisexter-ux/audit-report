name: Apply force dashboard refresh fix
on:
  push:
    paths:
      - "tools/apply_force_dashboard_refresh.py"
      - ".github/workflows/apply-force-dashboard-refresh.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python3 tools/apply_force_dashboard_refresh.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py tests/test_dashboard_refresh_performance.py tests/test_release_asset_verification.py
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "fix: force queued dashboard refresh and harden attendance summary test"
          git push
