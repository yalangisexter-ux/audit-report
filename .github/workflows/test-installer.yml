name: Test Windows Installer

on:
  workflow_dispatch:

jobs:
  test-installer:
    runs-on: windows-latest
    steps:
      - name: Download installer
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/yalangisexter-ux/audit-report/releases/download/v1.1.92/RawStrengthEmployeeAuditManager-Setup.exe" -OutFile "setup.exe"
          Write-Host "Downloaded"

      - name: Verify and install
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("setup.exe")[0..1]
          if ($bytes[0] -ne 0x4D) { throw "Invalid EXE" }
          $dir = "$env:TEMP\audit-test"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $p = Start-Process -FilePath "setup.exe" -ArgumentList "/VERYSILENT /DIR=$dir /NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Install failed" }
          Write-Host "Installed"

      - name: Launch and verify
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:TEMP\audit-test" -Filter "*.exe" -Recurse | Select-Object -First 1
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($proc.HasExited) { throw "App exited early" }
          Stop-Process -Id $proc.Id -Force
          Write-Host "PASS: App stayed running"
