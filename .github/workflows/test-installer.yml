name: Test Windows Installer

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Download installer
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/yalangisexter-ux/audit-report/releases/download/v1.1.137/RawStrengthEmployeeAuditManager-Setup.exe" -OutFile "setup.exe"
          Write-Host "Downloaded"

      - name: Install
        shell: pwsh
        run: |
          $dir = "$env:TEMP\audit-test"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $p = Start-Process -FilePath "setup.exe" -ArgumentList "/VERYSILENT /DIR=$dir /NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Install failed" }
          Write-Host "Installed"

      - name: Launch test
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:TEMP\audit-test" -Filter "*.exe" -Recurse | Select-Object -First 1
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) { throw "App exited" }
          Stop-Process -Id $proc.Id -Force
          Write-Host "PASS"
