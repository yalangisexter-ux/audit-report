for cls in ['QAction', 'QPainter', 'QColor', 'QPen', 'QFont', 'QFontDatabase', 'QIcon', 'QPixmap']:
    setattr(qtgui, cls, type(cls, (), {'__init__': lambda s,*a,**k: None}))
qtwidgets = sys.modules['PySide6.QtWidgets']
for cls in ['QApplication', 'QMainWindow', 'QWidget', 'QVBoxLayout', 'QHBoxLayout', 'QFormLayout', 'QGridLayout',
            'QTabWidget', 'QLabel', 'QPushButton', 'QLineEdit', 'QTextEdit', 'QComboBox', 'QSpinBox',
            'QDoubleSpinBox', 'QDateEdit', 'QTimeEdit', 'QTableWidget', 'QTableWidgetItem',
            'QMessageBox', 'QFileDialog', 'QInputDialog', 'QDialog', 'QDialogButtonBox', 'QHeaderView',
            'QGroupBox', 'QProgressBar', 'QAbstractItemView', 'QCheckBox', 'QScrollArea', 'QGraphicsOpacityEffect',
            'QToolButton', 'QMenu', 'QSizePolicy', 'QFrame']:
    setattr(qtwidgets, cls, type(cls, (), {'__init__': lambda s,*a,**k: None}))
sys.modules['docx'].Document = type('Document', (), {})
for cls in ['Inches', 'Pt', 'RGBColor']:
    setattr(sys.modules['docx.shared'], cls, type(cls, (), {}))
sys.modules['reportlab.lib.pagesizes'].A4 = object()
sys.modules['reportlab.lib.styles'].getSampleStyleSheet = lambda: {}
sys.modules['reportlab.lib.styles'].ParagraphStyle = type('ParagraphStyle', (), {})
sys.modules['reportlab.lib.enums'].TA_CENTER = 1
sys.modules['reportlab.lib.enums'].TA_LEFT = 0
for cls in ['SimpleDocTemplate', 'Paragraph', 'Spacer', 'PageBreak', 'KeepTogether', 'HRFlowable']:
    setattr(sys.modules['reportlab.platypus'], cls, type(cls, (), {}))
