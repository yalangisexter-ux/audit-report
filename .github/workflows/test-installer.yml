sys.modules['reportlab.pdfbase.ttfonts'].TTFont = type('TTFont', (), {})
sys.modules['reportlab.lib.colors'].black = object()
sys.modules['build_info'].APP_VERSION = '1.1.92'
import app, business_tracking
from datetime import datetime
fd, path = tempfile.mkstemp(suffix='.db')
os.close(fd)
app.DB_PATH = path
db = app.Database()
now = datetime.now().strftime('%Y-%m-%d %H:%M:%S')
db.conn.execute("INSERT INTO employees(name,department,designation,active,created_at) VALUES(?,?,?,?,?)", ('Existing Emp', 'HR', 'Staff', 1, now))
db.conn.commit()
eid = db.conn.execute("SELECT id FROM employees WHERE name='Existing Emp'").fetchone()[0]
db.conn.execute("INSERT INTO tasks(employee_id,task_date,title,status,progress,created_at,updated_at) VALUES(?,?,?,?,?,?,?)", (eid, '2026-10-12', 'Existing Task', 'Submitted', 100, now, now))
db.conn.commit()
business_tracking.setup_business_tables(db.conn)
db.conn.execute("INSERT INTO bt_products(sku,name,opening_stock,updated_at) VALUES(?,?,?,?)", ('SKU1', 'Test Product', 50, now))
db.conn.commit()
emp = db.conn.execute("SELECT name FROM employees WHERE id=?", (eid,)).fetchone()
task = db.conn.execute("SELECT title FROM tasks WHERE employee_id=?", (eid,)).fetchone()
prod = db.conn.execute("SELECT name FROM bt_products WHERE sku='SKU1'").fetchone()
assert emp['name'] == 'Existing Emp', 'Employee lost'
assert task['title'] == 'Existing Task', 'Task lost'
assert prod['name'] == 'Test Product', 'Product lost'
