name: Test Windows Installer

on:
  workflow_dispatch:
    inputs:
      installer_url:
        description: "Installer URL"
        required: true
        default: "https://github.com/yalangisexter-ux/audit-report/releases/download/v1.1.92/RawStrengthEmployeeAuditManager-Setup.exe"

jobs:
  test-installer:
    runs-on: windows-latest
    steps:
      - name: Download installer
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ inputs.installer_url }}" -OutFile "setup.exe"
          $item = Get-Item setup.exe
          if ($item.Length -lt 1000000) { throw "Installer too small: $($item.Length) bytes" }
          Write-Host "Downloaded $($item.Length) bytes"

      - name: Verify PE header
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("setup.exe")[0..1]
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Not a valid MZ executable" }
          Write-Host "PE header OK"

      - name: Silent install
        shell: pwsh
        run: |
          $installDir = "$env:TEMP\audit-test-install"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          $proc = Start-Process -FilePath "setup.exe" -ArgumentList "/VERYSILENT /DIR=$installDir /NORESTART /LOG=$env:TEMP\install.log" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer failed with exit code $($proc.ExitCode)" }
          $exe = Get-ChildItem $installDir -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "No EXE found after install" }
          Write-Host "Installed: $($exe.FullName)"

      - name: Launch and verify app stays running
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:TEMP\audit-test-install" -Filter "*.exe" -Recurse | Select-Object -First 1
          $logPath = "$env:TEMP\app-launch.log"
          $proc = Start-Process -FilePath $exe.FullName -PassThru -RedirectStandardOutput $logPath -RedirectStandardError "$env:TEMP\app-error.log"
          Start-Sleep -Seconds 10
          if ($proc.HasExited) {
            Write-Host "App exited early with code $($proc.ExitCode)"
            if (Test-Path $logPath) { Get-Content $logPath }
            if (Test-Path "$env:TEMP\app-error.log") { Get-Content "$env:TEMP\app-error.log" }
            throw "Application exited unexpectedly during startup"
          }
          Write-Host "App still running after 10 seconds (PID $($proc.Id))"
          Stop-Process -Id $proc.Id -Force
          Write-Host "PASS: App launched and stayed running"

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test data preservation on disposable DB
        shell: pwsh
        run: |
          python -m pip install pytest -q
          python -c @"
import sqlite3, tempfile, os
from datetime import datetime
fd, path = tempfile.mkstemp(suffix='.db')
os.close(fd)
conn = sqlite3.connect(path)
conn.row_factory = sqlite3.Row
conn.execute('CREATE TABLE employees(id INTEGER PRIMARY KEY, name TEXT)')
conn.execute("INSERT INTO employees VALUES (1, 'Existing Employee')")
conn.commit()
# Simulate adding a task
conn.execute('CREATE TABLE tasks(id INTEGER PRIMARY KEY, employee_id INTEGER, title TEXT, status TEXT)')
conn.execute("INSERT INTO tasks VALUES (1, 1, 'Existing Task', 'Submitted')")
conn.commit()
# Verify
emp = conn.execute('SELECT name FROM employees WHERE id=1').fetchone()
task = conn.execute('SELECT title FROM tasks WHERE employee_id=1').fetchone()
assert emp['name'] == 'Existing Employee'
assert task['title'] == 'Existing Task'
print('PASS: Employee preserved')
print('PASS: Task preserved')
conn.close()
os.unlink(path)
"@
