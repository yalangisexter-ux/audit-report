name: Apply auth_users migration fix
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/fix_auth_users_migration.py'
      - 'tools/ensure_admin_accounts_on_upgrade.py'
      - '.github/workflows/apply-auth-migration-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration + ensure accounts
        run: |
          python3 tools/fix_auth_users_migration.py || true
          python3 tools/ensure_admin_accounts_on_upgrade.py
      - name: Commit if changed
        run: |
          git config user.name "Audit Engineer"
          git config user.email "engineer@audit-report.local"
          git add app.py
          if git diff --cached --quiet; then
            echo "No app.py changes"
          else
            git commit -m "fix(desktop): ensure Admin/Shiva@01 and admin/kiran123 without wiping customer DB"
            git push origin HEAD:main
          fi
