name: Apply dashboard queue refresh fix
on:
  push:
    paths:
      - "tools/apply_dashboard_queue_refresh_fix.py"
      - ".github/workflows/apply-dashboard-queue-refresh-fix.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python3 tools/apply_dashboard_queue_refresh_fix.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py tests/test_dashboard_refresh_performance.py
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "fix: allow queued refresh_dashboard job to update attendance summary"
          git push
