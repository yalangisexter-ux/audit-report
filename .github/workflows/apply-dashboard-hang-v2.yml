name: Apply dashboard hang fix v2
on:
  push:
    paths:
      - "tools/apply_dashboard_hang_fix_v2.py"
      - ".github/workflows/apply-dashboard-hang-v2.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hang fix
        run: python3 tools/apply_dashboard_hang_fix_v2.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py tests/test_dashboard_productivity_async.py
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "fix: dashboard hang - final-only chart paint, deferred worker, identity-safe opacity skip"
          git push
