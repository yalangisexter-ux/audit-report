name: Align version metadata to 1.3.82
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/align-version-1-3-82.yml'
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full test file and align versions
        run: |
          set -euo pipefail
          # Restore complete test from last known-good commit before truncation
          git show af0c19e:tests/test_web_update_center.py > tests/test_web_update_center.py
          python3 - <<'PY'
          from pathlib import Path
          import json

          tpath = Path('tests/test_web_update_center.py')
          text = tpath.read_text(encoding='utf-8')
          text = text.replace('assert body["current_version"] == "1.3.81"', 'assert body["current_version"] == "1.3.82"')
          tpath.write_text(text, encoding='utf-8')
          assert text.count('def test_') >= 5, text.count('def test_')
          assert 'current_version"] == "1.3.82"' in text

          pkg = Path('frontend/package.json')
          data = json.loads(pkg.read_text(encoding='utf-8'))
          data['version'] = '1.3.82'
          pkg.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          lock_path = Path('frontend/package-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock['version'] = '1.3.82'
          lock.setdefault('packages', {}).setdefault('', {})['version'] = '1.3.82'
          lock_path.write_text(json.dumps(lock, indent=2) + '\n', encoding='utf-8')

          print('aligned', data['version'], lock['version'], tpath.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name "Audit Engineer"
          git config user.email "engineer@audit-report.local"
          git add tests/test_web_update_center.py frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix(ci): restore update-center tests and align frontend versions to 1.3.82"
            git push origin HEAD:main
          fi
