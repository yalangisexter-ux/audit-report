name: Restore Phase 1 web files
on:
  push:
    paths:
      - "tools/restore_phase1_*.py"
      - ".github/workflows/restore-phase1-web.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore files
        run: |
          python3 tools/restore_phase1_render_yaml.py || true
          python3 tools/restore_phase1_app_jsx.py || true
          python3 tools/restore_phase1_api_server.py || true
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api_server.py frontend/src/App.jsx render.yaml || true
          if git diff --cached --quiet; then echo No change; exit 0; fi
          git commit -m "fix: restore Phase 1 web parity files"
          git push
