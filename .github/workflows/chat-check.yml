name: Cloudflare Live Chat Checks

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-chat/**"
      - "chat-web/**"
      - "cloudflare_chat.py"
      - "tests/test_web_live_chat_parity.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-chat:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require main branch
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Chat checks are main-only; refusing ref $GITHUB_REF." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Validate Worker JavaScript
        run: node --check cloudflare-chat/src/index.js

      - name: Validate browser chat JavaScript
        run: node --check chat-web/app.js

      - name: Compile desktop modules
        run: python -m py_compile app.py build_info.py business_tracking.py cloudflare_chat.py

      - name: Run regression and chat tests
        run: python -m pytest -q
