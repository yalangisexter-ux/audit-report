name: Apply login and attendance web fix
on:
  push:
    paths:
      - "tools/apply_login_and_attendance_web.py"
      - ".github/workflows/apply-login-attendance-web.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -euo pipefail
          python3 tools/apply_login_and_attendance_web.py
          python3 -m py_compile api_server.py
          grep -q "def ensure_canonical_accounts" api_server.py
          grep -q "Shiva@01" api_server.py
          grep -q 'if status.casefold() in {"absent", "leave", "unmarked"}:' api_server.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api_server.py
          if git diff --cached --quiet; then echo No change; exit 0; fi
          git commit -m "fix(web): Admin login + attendance mark persistence"
          git push
