name: Deploy Cloudflare Live Chat

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-live-chat-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy chat Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-chat
    defaults:
      run:
        working-directory: cloudflare-chat
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CHAT_JWT_SECRET: ${{ secrets.CHAT_JWT_SECRET }}
          CHAT_BOOTSTRAP_TOKEN: ${{ secrets.CHAT_BOOTSTRAP_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing Actions secret CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing Actions variable CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$CHAT_JWT_SECRET" || (echo "Missing Actions secret CHAT_JWT_SECRET" && exit 1)
          test -n "$CHAT_BOOTSTRAP_TOKEN" || (echo "Missing Actions secret CHAT_BOOTSTRAP_TOKEN" && exit 1)
          test "${#CHAT_JWT_SECRET}" -ge 32 || (echo "CHAT_JWT_SECRET must be at least 32 characters" && exit 1)

      - name: Install Wrangler
        run: npm install --no-audit --no-fund

      - name: Check Worker JavaScript
        run: npm run check

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply rsc-employee-chat-livescreen-sharing --remote --config wrangler.toml

      - name: Set Worker authentication secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CHAT_JWT_SECRET: ${{ secrets.CHAT_JWT_SECRET }}
          CHAT_BOOTSTRAP_TOKEN: ${{ secrets.CHAT_BOOTSTRAP_TOKEN }}
        run: |
          printf '%s' "$CHAT_JWT_SECRET" | npx wrangler secret put CHAT_JWT_SECRET --config wrangler.toml
          printf '%s' "$CHAT_BOOTSTRAP_TOKEN" | npx wrangler secret put CHAT_BOOTSTRAP_TOKEN --config wrangler.toml

      - name: Deploy Worker and web assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Deployment reminder
        run: |
          echo "Worker deployment command completed."
          echo "Bootstrap the first admin exactly once using the protected bootstrap token."
          echo "Do not expose the bootstrap token or commit it to source control."
