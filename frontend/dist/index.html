<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Raw Strength Calisthenics — Employee Audit Manager</title>
<style>
:root{--bg:#020617;--card:#0f172a;--line:rgba(255,255,255,.08);--text:#e2e8f0;--muted:#94a3b8;--accent:#22d3ee;--accent2:#6366f1}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#1e293b 0%,var(--bg) 55%);color:var(--text);min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:min(420px,100%);background:rgba(15,23,42,.95);border:1px solid var(--line);border-radius:18px;padding:24px}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#22d3ee,#6366f1);display:grid;place-items:center;font-weight:800}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
input,select,textarea{width:100%;background:#020617;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px 12px}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;color:#0b1220;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.btn.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}.btn.sm{padding:7px 10px;border-radius:8px;font-size:12px}
.err{margin-top:12px;padding:10px;border-radius:10px;background:rgba(127,29,29,.35);color:#fecaca;display:none}
.shell{display:none;min-height:100vh}.shell.on{display:flex}
.sidebar{width:270px;background:rgba(2,6,23,.97);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.nav{padding:10px;flex:1;overflow:auto}.nav button{width:100%;text-align:left;background:transparent;border:0;color:var(--muted);padding:11px 12px;border-radius:10px;margin-bottom:4px}
.nav button.active,.nav button:hover{background:rgba(34,211,238,.12);color:var(--text)}
.sidebar-foot{padding:12px;border-top:1px solid var(--line)}.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}.content{padding:16px 18px 28px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.kpi b{display:block;font-size:22px;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.card h2{margin:0 0 10px;font-size:16px}
.muted{color:var(--muted);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list{display:flex;flex-direction:column;gap:8px}.item{display:flex;justify-content:space-between;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(2,6,23,.35)}
.badge{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.toast{position:fixed;right:16px;bottom:16px;background:#0f172a;border:1px solid var(--line);padding:12px;border-radius:12px;display:none;z-index:50;max-width:320px}
.section{font-size:11px;letter-spacing:.08em;color:#64748b;text-transform:uppercase;margin:10px 8px 6px;font-weight:700}
@media(max-width:900px){.sidebar{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-105%);transition:.2s}.sidebar.open{transform:none}.menu-btn{display:inline-flex!important}}
.menu-btn{display:none}
</style></head><body>
<div id="loginView" class="login-wrap"><div class="login-card">
<div class="brand"><div class="logo">RSC</div><div><div style="font-weight:800">Raw Strength Calisthenics</div><div class="muted">Employee Audit Manager · Web</div></div></div>
<p class="muted">Exact case: <b>Admin</b> (customer) or <b>admin</b> (developer).</p>
<label>Username</label><input id="username" value="Admin" autocomplete="username"/>
<label>Password</label><div class="row"><input id="password" type="password" style="flex:1" autocomplete="current-password"/><button type="button" class="btn secondary sm" id="togglePw">Show</button></div>
<div style="margin-top:16px"><button class="btn" id="loginBtn" style="width:100%">Sign in</button></div>
<div class="err" id="loginErr"></div>
</div></div>
<div id="appShell" class="shell">
<aside class="sidebar" id="sidebar">
<div style="padding:16px;border-bottom:1px solid var(--line)"><div class="brand" style="margin:0"><div class="logo">RSC</div><div><div style="font-weight:700;font-size:14px">Audit Manager</div><div class="muted" id="userLabel">—</div></div></div></div>
<nav class="nav" id="nav">
<div class="section">Operations</div>
<button data-tab="dashboard" class="active">Dashboard</button>
<button data-tab="employees">Employees</button>
<button data-tab="tasks">Tasks</button>
<button data-tab="attendance">Attendance</button>
<div class="section">Business</div>
<button data-tab="business">Business Tracking</button>
<button data-tab="customers">Customer Directory</button>
<div class="section">Output</div>
<button data-tab="print">Print Center</button>
<button data-tab="reports">Reports</button>
<button data-tab="settings">Settings</button>
</nav>
<div class="sidebar-foot">
<button class="btn secondary" id="syncBtn" style="width:100%;margin-bottom:8px">Sync Now</button>
<button class="btn secondary" id="logoutBtn" style="width:100%">Sign out</button>
</div></aside>
<div class="main">
<div class="top"><div class="row"><button class="btn secondary sm menu-btn" id="menuBtn">Menu</button><div><div style="font-weight:700" id="pageTitle">Dashboard</div><div class="muted" id="pageSub">Live shared database</div></div></div><div class="muted" id="clock"></div></div>
<div class="content" id="content"></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
const API='';let token=localStorage.getItem('rsc_auth_token')||'';let user=null,tab='dashboard';
let cache={dashboard:null,employees:[],tasks:[],attendance:null,products:[],services:[],orders:[],members:[],activities:[],overview:{},prospects:[],custSummary:{},printSummary:{},holidays:[],authStatus:null,dbInfo:null,settings:{}};
const titles={dashboard:'Dashboard',employees:'Employees',tasks:'Tasks',attendance:'Attendance',business:'Business Tracking',customers:'Customer Directory',print:'Print Center',reports:'Reports',settings:'Settings'};
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2800)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]))}
function badge(st){return `<span class="badge">${esc(st||'—')}</span>`}
async function api(path,opts={}){const h=Object.assign({'Content-Type':'application/json'},opts.headers||{});if(token)h.Authorization='Bearer '+token;const res=await fetch(API+'/api'+path,{...opts,headers:h});if(res.status===401&&path!=='/auth/login'){token='';localStorage.removeItem('rsc_auth_token');showLogin()}return res}
function showLogin(){document.getElementById('loginView').style.display='flex';document.getElementById('appShell').classList.remove('on')}
function showApp(){document.getElementById('loginView').style.display='none';document.getElementById('appShell').classList.add('on');document.getElementById('userLabel').textContent=(user&&(user.display_name||user.username))||'Signed in'}
async function doLogin(){const username=document.getElementById('username').value.trim();const password=document.getElementById('password').value;const err=document.getElementById('loginErr');err.style.display='none';document.getElementById('loginBtn').disabled=true;try{const res=await api('/auth/login',{method:'POST',body:JSON.stringify({username,password})});const data=await res.json();if(!res.ok)throw new Error(data.detail||'Login failed');token=data.token;user=data.user;localStorage.setItem('rsc_auth_token',token);showApp();await loadAll();render()}catch(e){err.textContent=e.message;err.style.display='block'}finally{document.getElementById('loginBtn').disabled=false}}
async function loadAll(){const jobs=[['/dashboard','dashboard'],['/employees','employees'],['/tasks','tasks'],['/attendance','attendance'],['/business/products','products'],['/business/services','services'],['/business/orders','orders'],['/business/members','members'],['/business/activities','activities'],['/business/overview','overview'],['/customers/prospects','prospects'],['/customers/summary','custSummary'],['/print-center/summary','printSummary'],['/holidays','holidays'],['/auth/status','authStatus'],['/system/db-info','dbInfo'],['/settings','settings']];await Promise.all(jobs.map(async([p,k])=>{try{const r=await api(p);if(r.ok)cache[k]=await r.json()}catch{}}))}
function kpi(l,v){return `<div class="kpi"><div class="muted">${esc(l)}</div><b>${esc(v??'—')}</b></div>`}
function listBlock(t,rows,fn){return `<div class="card"><h2>${esc(t)}</h2><div class="list">${(rows&&rows.length)?rows.map(fn).join(''):'<div class="muted">No records.</div>'}</div></div>`}
function renderDashboard(){const d=cache.dashboard||{},k=d.kpis||{};return `<div class="grid">${kpi('Employees',k.total_employees??cache.employees.length)}${kpi('Present',k.present_today)}${kpi('Open tasks',k.open_tasks)}${kpi('Completed',k.completed_tasks)}${kpi('Orders',cache.orders.length)}${kpi('Prospects',cache.custSummary.total||cache.prospects.length)}</div>`+listBlock('Recent employees',(d.recent_employees||cache.employees).slice(0,8),e=>`<div class="item"><div><strong>${esc(e.name)}</strong><span class="muted">${esc([e.department,e.designation].filter(Boolean).join(' · '))}</span></div>${badge(e.active?'Active':'Inactive')}</div>`)+listBlock('Tasks',(d.today_tasks||cache.tasks).slice(0,10),t=>`<div class="item"><div><strong>${esc(t.title)}</strong><span class="muted">${esc([t.employee_name||t.employee_id,t.status].join(' · '))}</span></div>${badge(t.status)}</div>`)}
function renderEmployees(){return `<div class="card"><h2>Add employee</h2><div class="form-grid"><input id="empName" placeholder="Name *"/><input id="empDept" placeholder="Department"/><input id="empDesig" placeholder="Designation"/><input id="empPhone" placeholder="Phone"/><input id="empEmail" placeholder="Email"/></div><div style="margin-top:10px"><button class="btn sm" id="empCreate">Save employee</button></div></div>`+listBlock('Employees ('+cache.employees.length+')',cache.employees,e=>`<div class="item"><div><strong>${esc(e.name)}</strong><span class="muted">${esc([e.department,e.phone,e.email].filter(Boolean).join(' · '))}</span></div><div class="row">${badge(e.active?'Active':'Inactive')}<button class="btn secondary sm" data-del-emp="${e.id}">Remove</button></div></div>`)}
function renderTasks(){const opts=cache.employees.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');return `<div class="card"><h2>New task</h2><div class="form-grid"><input id="taskTitle" placeholder="Title *"/><select id="taskEmp">${opts||'<option value="1">Employee</option>'}</select><input id="taskDate" type="date"/><select id="taskStatus"><option>Not started</option><option>In progress</option><option>Submitted</option><option>Completed</option></select><select id="taskPriority"><option>Normal</option><option>High</option><option>Low</option></select><input id="taskDetails" placeholder="Details"/></div><div style="margin-top:10px"><button class="btn sm" id="taskCreate">Create task</button></div></div>`+listBlock('Tasks ('+cache.tasks.length+')',cache.tasks,t=>`<div class="item"><div><strong>${esc(t.title)}</strong><span class="muted">${esc([t.employee_name||('#'+t.employee_id),t.task_date,t.priority,t.status].filter(Boolean).join(' · '))}</span></div><div class="row">${badge(t.status)}<select data-task-status="${t.id}"><option>Not started</option><option>In progress</option><option>Submitted</option><option>Completed</option></select><button class="btn secondary sm" data-del-task="${t.id}">Delete</button></div></div>`)}
function renderAttendance(){const roster=(cache.attendance&&cache.attendance.roster)||[];return `<div class="muted" style="margin-bottom:10px">Date: ${esc((cache.attendance&&cache.attendance.date)||new Date().toISOString().slice(0,10))}</div>`+listBlock('Roster',roster,r=>`<div class="item"><div><strong>${esc(r.name||r.employee_name||r.employee_id)}</strong><span class="muted">${esc(r.department||'')}</span></div><div class="row">${badge(r.attendance_status||r.status||'Unmarked')}<button class="btn sm" data-mark="${r.employee_id||r.id}" data-status="Present">Present</button><button class="btn secondary sm" data-mark="${r.employee_id||r.id}" data-status="Absent">Absent</button><button class="btn secondary sm" data-mark="${r.employee_id||r.id}" data-status="Leave">Leave</button></div></div>`)}
function renderBusiness(){const o=cache.overview||{};return `<div class="grid">${kpi('Products',o.products??cache.products.length)}${kpi('Orders',o.orders??cache.orders.length)}${kpi('Services',o.services??cache.services.length)}${kpi('Members',o.members??cache.members.length)}${kpi('Activities',o.activities??cache.activities.length)}</div>
<div class="card"><h2>New order</h2><div class="form-grid"><input id="ordName" placeholder="Customer name"/><input id="ordValue" type="number" step="0.01" placeholder="Value"/><input id="ordChannel" placeholder="Channel"/><select id="ordStatus"><option>Open</option><option>Completed</option><option>Cancelled</option></select></div><div style="margin-top:10px"><button class="btn sm" id="ordCreate">Create order</button></div></div>
<div class="card"><h2>New member</h2><div class="form-grid"><input id="memName" placeholder="Full name *"/><input id="memPlan" placeholder="Plan"/><input id="memPhone" placeholder="Phone"/><select id="memStatus"><option>Active</option><option>Inactive</option></select></div><div style="margin-top:10px"><button class="btn sm" id="memCreate">Create member</button></div></div>
`+listBlock('Orders',cache.orders,r=>`<div class="item"><div><strong>${esc(r.customer_name||r.order_code||r.id)}</strong><span class="muted">${esc([r.status,r.order_date,r.order_value!=null?'₹'+r.order_value:''].filter(Boolean).join(' · '))}</span></div>${badge(r.status)}</div>`)+listBlock('Members',cache.members,r=>`<div class="item"><div><strong>${esc(r.full_name||r.name||r.id)}</strong><span class="muted">${esc([r.plan_name,r.phone,r.status].filter(Boolean).join(' · '))}</span></div>${badge(r.status||'Member')}</div>`)+listBlock('Products',cache.products,p=>`<div class="item"><strong>${esc(p.name)}</strong>${badge(p.selling_price!=null?'₹'+p.selling_price:'')}</div>`)+listBlock('Services',cache.services,s=>`<div class="item"><strong>${esc(s.name)}</strong>${badge(s.standard_price!=null?'₹'+s.standard_price:'')}</div>`)}
function renderCustomers(){return `<div class="grid">${kpi('Prospects',cache.custSummary.total||cache.prospects.length)}</div>
<div class="card"><h2>Add prospect</h2><div class="form-grid"><input id="prName" placeholder="Business name *"/><input id="prCity" placeholder="City"/><input id="prState" placeholder="State"/><input id="prPhone" placeholder="Phone"/><input id="prContact" placeholder="Contact person"/><input id="prNotes" placeholder="Notes"/></div><div style="margin-top:10px"><button class="btn sm" id="prCreate">Save prospect</button></div></div>
`+listBlock('Directory',cache.prospects,p=>`<div class="item"><div><strong>${esc(p.business_name||p.name||p.id)}</strong><span class="muted">${esc([p.city,p.state,p.phone,p.contact_person||p.contact_name].filter(Boolean).join(' · '))}</span></div>${badge(p.state||'Prospect')}</div>`)}
function renderPrint(){const pc=cache.printSummary||{};return `<div class="grid">${kpi('Date',pc.report_date||new Date().toISOString().slice(0,10))}${kpi('Employees',pc.employees||pc.employee_count)}${kpi('Open tasks',pc.tasks_open)}${kpi('Attendance',pc.attendance_today)}${kpi('Orders',pc.orders)}${kpi('Members',pc.members)}</div>`+listBlock('Tasks for print',pc.tasks||[],t=>`<div class="item"><strong>${esc(t.title)}</strong><span class="muted">${esc([t.employee_name,t.status,t.task_date].filter(Boolean).join(' · '))}</span></div>`)+listBlock('Attendance for print',pc.attendance||[],r=>`<div class="item"><strong>${esc(r.name)}</strong><span class="muted">${esc([r.attendance_status,r.check_in,r.check_out].filter(Boolean).join(' · '))}</span></div>`)+`<div class="card"><h2>Print Center</h2><p class="muted">${esc(pc.note||'Live web summary from shared DB.')}</p><button class="btn secondary sm" onclick="print()">Print this page</button></div>`}
function renderReports(){const by={};cache.tasks.forEach(t=>{const s=String(t.status||'Unknown');by[s]=(by[s]||0)+1});const rows=Object.keys(by).map(k=>({name:k,count:by[k]}));return `<div class="grid">${kpi('Employees',cache.employees.length)}${kpi('Tasks',cache.tasks.length)}${kpi('Prospects',cache.prospects.length)}${kpi('Products',cache.products.length)}</div>`+listBlock('Tasks by status',rows,r=>`<div class="item"><strong>${esc(r.name)}</strong><span class="badge">${r.count}</span></div>`)+listBlock('Holidays',cache.holidays,h=>`<div class="item"><strong>${esc(h.holiday_name||'')}</strong><span class="muted">${esc(h.holiday_date||'')}</span></div>`)+`<div class="card"><h2>Reports</h2><p class="muted">Operational web summaries are live. Branded multi-format PDF/Word export remains available in the desktop EXE during the final export parity phase.</p></div>`}
function renderSettings(){return `<div class="card"><h2>Account</h2><p><strong>${esc(user&&user.display_name)}</strong><br/><span class="muted">${esc(user&&user.role)} · ${esc(user&&user.username)}</span></p></div>
<div class="card"><h2>Database & sync</h2><pre class="muted" style="white-space:pre-wrap;font-size:12px">${esc(JSON.stringify({auth:cache.authStatus,db:cache.dbInfo,settings:cache.settings},null,2))}</pre>
<div class="row" style="margin-top:10px"><button class="btn sm" id="syncBtn2">Sync Now</button><button class="btn secondary sm" id="reloadData">Reload</button></div></div>`}
function render(){document.getElementById('pageTitle').textContent=titles[tab]||tab;document.getElementById('pageSub').textContent=new Date().toLocaleString();document.querySelectorAll('#nav button[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const m={dashboard:renderDashboard,employees:renderEmployees,tasks:renderTasks,attendance:renderAttendance,business:renderBusiness,customers:renderCustomers,print:renderPrint,reports:renderReports,settings:renderSettings};document.getElementById('content').innerHTML=(m[tab]||renderDashboard)();bind()}
function bind(){
const ec=document.getElementById('empCreate');if(ec)ec.onclick=async()=>{const name=document.getElementById('empName').value.trim();if(!name)return toast('Name required');const res=await api('/employees',{method:'POST',body:JSON.stringify({name,department:document.getElementById('empDept').value,designation:document.getElementById('empDesig').value,phone:document.getElementById('empPhone').value,email:document.getElementById('empEmail').value,active:1})});toast(res.ok?'Employee saved':'Failed');await loadAll();render()};
document.querySelectorAll('[data-del-emp]').forEach(b=>b.onclick=async()=>{if(!confirm('Remove employee?'))return;await api('/employees/'+b.dataset.delEmp,{method:'DELETE'});await loadAll();render()});
const tc=document.getElementById('taskCreate');if(tc)tc.onclick=async()=>{const title=document.getElementById('taskTitle').value.trim();if(!title)return toast('Title required');const res=await api('/tasks',{method:'POST',body:JSON.stringify({title,employee_id:Number(document.getElementById('taskEmp').value||1),task_date:document.getElementById('taskDate').value||null,status:document.getElementById('taskStatus').value,priority:document.getElementById('taskPriority').value,details:document.getElementById('taskDetails').value})});toast(res.ok?'Task created':'Failed');await loadAll();render()};
document.querySelectorAll('[data-task-status]').forEach(sel=>{sel.onchange=async()=>{const id=sel.dataset.taskStatus;const t=cache.tasks.find(x=>String(x.id)===String(id));if(!t)return;await api('/tasks/'+id,{method:'PUT',body:JSON.stringify({title:t.title,employee_id:t.employee_id,status:sel.value,task_date:t.task_date,priority:t.priority||'Normal',details:t.details||''})});await loadAll();render()}});
document.querySelectorAll('[data-del-task]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete task?'))return;await api('/tasks/'+b.dataset.delTask,{method:'DELETE'});await loadAll();render()});
document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=async()=>{await api('/attendance/mark',{method:'POST',body:JSON.stringify({employee_id:Number(b.dataset.mark),attendance_status:b.dataset.status})});toast('Marked '+b.dataset.status);await loadAll();render()});
const oc=document.getElementById('ordCreate');if(oc)oc.onclick=async()=>{const res=await api('/business/orders',{method:'POST',body:JSON.stringify({customer_name:document.getElementById('ordName').value,order_value:Number(document.getElementById('ordValue').value||0),channel:document.getElementById('ordChannel').value,status:document.getElementById('ordStatus').value})});toast(res.ok?'Order created':'Order failed');await loadAll();render()};
const mc=document.getElementById('memCreate');if(mc)mc.onclick=async()=>{const full_name=document.getElementById('memName').value.trim();if(!full_name)return toast('Name required');const res=await api('/business/members',{method:'POST',body:JSON.stringify({full_name,plan_name:document.getElementById('memPlan').value,phone:document.getElementById('memPhone').value,status:document.getElementById('memStatus').value})});toast(res.ok?'Member created':'Member failed');await loadAll();render()};
const pc=document.getElementById('prCreate');if(pc)pc.onclick=async()=>{const business_name=document.getElementById('prName').value.trim();if(!business_name)return toast('Business name required');const res=await api('/customers/prospects',{method:'POST',body:JSON.stringify({business_name,city:document.getElementById('prCity').value,state:document.getElementById('prState').value,phone:document.getElementById('prPhone').value,contact_person:document.getElementById('prContact').value,notes:document.getElementById('prNotes').value})});toast(res.ok?'Prospect saved':'Prospect failed');await loadAll();render()};
const s2=document.getElementById('syncBtn2');if(s2)s2.onclick=()=>document.getElementById('syncBtn').click();
const rl=document.getElementById('reloadData');if(rl)rl.onclick=async()=>{await loadAll();render();toast('Reloaded')};
}
document.getElementById('loginBtn').onclick=doLogin;
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
document.getElementById('togglePw').onclick=()=>{const i=document.getElementById('password');i.type=i.type==='password'?'text':'password';document.getElementById('togglePw').textContent=i.type==='password'?'Show':'Hide'};
document.getElementById('logoutBtn').onclick=()=>{token='';localStorage.removeItem('rsc_auth_token');showLogin()};
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('nav').onclick=e=>{const b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;document.getElementById('sidebar').classList.remove('open');render()};
document.getElementById('syncBtn').onclick=async()=>{const res=await api('/system/sync-now',{method:'POST',body:'{}'});toast(res.ok?'Sync done':'Sync failed');await loadAll();render()};
setInterval(()=>{const el=document.getElementById('clock');if(el)el.textContent=new Date().toLocaleString()},1000);
(async()=>{if(!token){showLogin();return}try{const r=await api('/auth/me');if(!r.ok)throw 0;user=(await r.json()).user;showApp();await loadAll();render()}catch{token='';localStorage.removeItem('rsc_auth_token');showLogin()}})();
</script></body></html>
