services:
  - type: web
    name: audit-report-web
    runtime: python
    plan: free
    autoDeploy: true
    region: oregon
    # Do NOT run npm build: Vite overwrites the operational sidebar UI in frontend/dist.
    buildCommand: pip install -r requirements-web.txt
    startCommand: python -c "import os; import web_auth_shim; import uvicorn; uvicorn.run('api_server:app', host='0.0.0.0', port=int(os.environ.get('PORT', '8000')), proxy_headers=True, forwarded_allow_ips='*')"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: QT_QPA_PLATFORM
        value: offscreen
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DB_SYNC_USE_DESKTOP_DEFAULT
        value: "1"
      - key: DB_SYNC_WORKER_URL
        value: "https://raw-strength-audit-db-sync.yalangisexter.workers.dev"
      - key: WEB_REQUIRE_LOGIN
        value: "1"
      - key: SKIP_INITIAL_AUDIT_SEED
        value: "1"
      - key: WEB_PURGE_SEED_DATA
        value: "0"
      - key: WEB_PURGE_DEMO_ROSTER
        value: "0"
    healthCheckPath: /api/health
