# Render Blueprint — testing deploy of the web UI + API
# Dashboard: https://dashboard.render.com
services:
  - type: web
    name: audit-report-web
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "import os; import uvicorn; uvicorn.run('api_server:app', host='0.0.0.0', port=int(os.environ.get('PORT', '8000')), proxy_headers=True, forwarded_allow_ips='*')"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: QT_QPA_PLATFORM
        value: offscreen
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /docs
